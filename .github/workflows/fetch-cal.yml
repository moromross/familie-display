name: Fetch Calendars
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install recurring-ical-events icalendar

      - name: Fetch and filter calendars
        env:
          CAL1_URL:   ${{ secrets.CAL1_URL }}
          CAL2_URL:   ${{ secrets.CAL2_URL }}
          WU_USER_K1: ${{ secrets.WU_USER_K1 }}
          WU_PASS_K1: ${{ secrets.WU_PASS_K1 }}
          WU_ID_K1:   ${{ secrets.WU_ID_K1 }}
          WU_USER_K2: ${{ secrets.WU_USER_K2 }}
          WU_PASS_K2: ${{ secrets.WU_PASS_K2 }}
          WU_ID_K2:   ${{ secrets.WU_ID_K2 }}
          WU_USER_K3: ${{ secrets.WU_USER_K3 }}
          WU_PASS_K3: ${{ secrets.WU_PASS_K3 }}
          WU_ID_K3:   ${{ secrets.WU_ID_K3 }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.error, json, os, http.cookiejar
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          from icalendar import Calendar
          import recurring_ical_events

          BERLIN  = ZoneInfo('Europe/Berlin')
          SCHOOL  = 'sachsenwaldschule-reinbek'
          WU_BASE = 'https://' + SCHOOL + '.webuntis.com/WebUntis'
          EMPTY   = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nEND:VCALENDAR\r\n"

          today     = date.today()
          date_from = today - timedelta(days=1)
          date_to   = today + timedelta(days=9)

          def dt_str(val):
              if isinstance(val, datetime):
                  if val.tzinfo:
                      val = val.astimezone(BERLIN).replace(tzinfo=None)
                  return val.strftime('%Y%m%dT%H%M%S')
              return val.strftime('%Y%m%d')

          def esc(s):
              return str(s).replace('\\','\\\\').replace('\n','\\n').replace(',','\\,').replace(';','\\;')

          def write_ics(fname, lines):
              open(fname, 'w', encoding='utf-8').write('\r\n'.join(lines) + '\r\n')

          # iCloud family calendars
          for fname, url in [("cal1.ics", os.environ.get("CAL1_URL","")),
                              ("cal2.ics", os.environ.get("CAL2_URL",""))]:
              if not url:
                  open(fname,'w').write(EMPTY); print(fname + ": no URL"); continue
              url = url.replace("webcal://","https://")
              try:
                  req  = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=30).read()
                  cal  = Calendar.from_ical(data)
                  evts = recurring_ical_events.of(cal).between(date_from, date_to)
                  lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Familie Display//DE"]
                  for ev in evts:
                      lines.append("BEGIN:VEVENT")
                      ds = ev.get('DTSTART')
                      if ds: lines.append("DTSTART:" + dt_str(ds.dt))
                      de = ev.get('DTEND')
                      if de: lines.append("DTEND:" + dt_str(de.dt))
                      elif ds:
                          v = ds.dt
                          fb = v + timedelta(hours=1) if isinstance(v,datetime) else v + timedelta(days=1)
                          lines.append("DTEND:" + dt_str(fb))
                      lines.append("SUMMARY:" + esc(ev.get('SUMMARY','')))
                      if ev.get('DESCRIPTION'): lines.append("DESCRIPTION:" + esc(ev.get('DESCRIPTION','')))
                      if ev.get('LOCATION'):    lines.append("LOCATION:"    + esc(ev.get('LOCATION','')))
                      lines.append("END:VEVENT")
                  lines.append("END:VCALENDAR")
                  write_ics(fname, lines)
                  print(fname + ": " + str(len(evts)) + " events")
              except Exception as e:
                  print(fname + " error: " + str(e)); open(fname,'w').write(EMPTY)

          # WebUntis — cookie-jar based session
          def make_opener():
              jar = http.cookiejar.CookieJar()
              return urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def wu_rpc(opener, method, params=None):
              if params is None: params = {}
              url     = WU_BASE + '/jsonrpc.do?school=' + SCHOOL
              payload = json.dumps({"id":"1","method":method,"params":params,"jsonrpc":"2.0"}).encode('utf-8')
              req     = urllib.request.Request(url, data=payload, headers={'Content-Type':'application/json'})
              resp    = opener.open(req, timeout=30)
              body    = json.loads(resp.read().decode('utf-8'))
              if 'error' in body:
                  print("  RPC error [" + method + "]: " + str(body['error']))
              return body.get('result')

          def wu_get_json(opener, path):
              url = WU_BASE + '/' + path
              req = urllib.request.Request(url, headers={'Accept':'application/json'})
              try:
                  resp = opener.open(req, timeout=30)
                  return json.loads(resp.read().decode('utf-8'))
              except Exception as e:
                  print("  GET " + path + " failed: " + str(e)); return {}

          def parse_wu_dt(date_int, time_int):
              s = str(date_int)
              return datetime(int(s[:4]), int(s[4:6]), int(s[6:8]),
                              time_int // 100, time_int % 100)

          def int_date(d): return int(d.strftime('%Y%m%d'))

          kids = [
              ('calk1.ics','calhw1.ics', os.environ.get('WU_USER_K1',''), os.environ.get('WU_PASS_K1',''), os.environ.get('WU_ID_K1','0')),
              ('calk2.ics','calhw2.ics', os.environ.get('WU_USER_K2',''), os.environ.get('WU_PASS_K2',''), os.environ.get('WU_ID_K2','0')),
              ('calk3.ics','calhw3.ics', os.environ.get('WU_USER_K3',''), os.environ.get('WU_PASS_K3',''), os.environ.get('WU_ID_K3','0')),
          ]

          for tt_f, hw_f, user, pwd, entity_id_str in kids:
              if not user or not pwd:
                  open(tt_f,'w').write(EMPTY); open(hw_f,'w').write(EMPTY)
                  print(tt_f + ": no credentials"); continue
              try:
                  person_id = int(entity_id_str) if entity_id_str.isdigit() else 0

                  # neuer Cookie-Jar pro Kind
                  opener = make_opener()

                  # Login
                  result = wu_rpc(opener, 'authenticate',
                      {'user':user,'password':pwd,'client':'familie-display'})
                  if result is None:
                      print(tt_f + ": login failed"); open(tt_f,'w').write(EMPTY); open(hw_f,'w').write(EMPTY); continue

                  print(tt_f + ": logged in, personId=" + str(person_id))

                  # Subject lookup
                  subj_result = wu_rpc(opener, 'getSubjects')
                  subjects = {}
                  if subj_result:
                      for s in subj_result:
                          subjects[s['id']] = s.get('longName', s.get('name', str(s['id'])))

                  # Timetable
                  tt_result = wu_rpc(opener, 'getTimetable', {'options':{
                      'startDate':     int_date(date_from),
                      'endDate':       int_date(date_to),
                      'element':       {'id':person_id,'type':5},
                      'showInfo':      True,
                      'showSubstText': True,
                      'subjectFields': ['id','name','longName'],
                      'roomFields':    ['id','name'],
                      'teacherFields': ['id','name'],
                  }})
                  print(tt_f + ": timetable count=" + str(len(tt_result or [])))

                  tt_lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Familie Display//DE"]
                  count_tt = 0
                  for p in (tt_result or []):
                      if str(p.get('code', p.get('lessonCode',''))) in ('1','CANCELLED'): continue
                      d_int = p.get('date',0); st = p.get('startTime',0); et = p.get('endTime',0)
                      if not d_int or not st: continue
                      start = parse_wu_dt(d_int, st)
                      end   = parse_wu_dt(d_int, et) if et else start + timedelta(hours=1)
                      subjs = p.get('subjects',[])
                      if subjs:
                          s0 = subjs[0]
                          subj_name = (s0.get('longName') or s0.get('name','?')) if isinstance(s0,dict) else subjects.get(s0, str(s0))
                      else:
                          subj_name = '?'
                      rooms   = p.get('rooms',[])
                      room    = (rooms[0].get('name','') if isinstance(rooms[0],dict) else '') if rooms else ''
                      tchrs   = p.get('teachers',[])
                      teacher = (tchrs[0].get('name','') if isinstance(tchrs[0],dict) else '') if tchrs else ''
                      tt_lines += ["BEGIN:VEVENT",
                          "DTSTART:" + start.strftime('%Y%m%dT%H%M%S'),
                          "DTEND:"   + end.strftime('%Y%m%dT%H%M%S'),
                          "SUMMARY:" + esc(subj_name)]
                      if room:    tt_lines.append("LOCATION:"    + esc(room))
                      if teacher: tt_lines.append("DESCRIPTION:" + esc(teacher))
                      tt_lines.append("END:VEVENT")
                      count_tt += 1
                  tt_lines.append("END:VCALENDAR")
                  write_ics(tt_f, tt_lines)
                  print(tt_f + ": " + str(count_tt) + " periods written")

                  # Homework
                  hw_data   = wu_get_json(opener, 'api/homeworks/lessons?startDate=' + str(date_from) + '&endDate=' + str(date_to))
                  homeworks = hw_data.get('data',{}).get('homeworks',[])
                  lessons_map = {}
                  for ls in hw_data.get('data',{}).get('lessons',[]):
                      lid = ls.get('id'); subj = ls.get('subject',{}) or {}
                      lessons_map[lid] = subj.get('longName', subj.get('name','?'))
                  hw_lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Familie Display//DE"]
                  count_hw = 0
                  for hw in homeworks:
                      due = str(hw.get('dueDate', hw.get('date',0)))
                      if len(due) != 8: continue
                      due_d = date(int(due[:4]), int(due[4:6]), int(due[6:8]))
                      if not (date_from <= due_d <= date_to): continue
                      subj_name = lessons_map.get(hw.get('lessonId'), '?')
                      txt = hw.get('text','').strip()
                      hw_lines += ["BEGIN:VEVENT", "DTSTART:"+due, "DTEND:"+due,
                          "SUMMARY:📝 " + esc(subj_name)]
                      if txt: hw_lines.append("DESCRIPTION:" + esc(txt))
                      hw_lines.append("END:VEVENT")
                      count_hw += 1
                  hw_lines.append("END:VCALENDAR")
                  write_ics(hw_f, hw_lines)
                  print(hw_f + ": " + str(count_hw) + " homeworks written")

                  try: wu_rpc(opener, 'logout')
                  except: pass

              except Exception as e:
                  import traceback
                  print(tt_f + " error: " + str(e))
                  print(traceback.format_exc())
                  open(tt_f,'w').write(EMPTY); open(hw_f,'w').write(EMPTY)
          PYEOF

      - name: Commit calendars
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add cal1.ics cal2.ics calk1.ics calk2.ics calk3.ics calhw1.ics calhw2.ics calhw3.ics
          git diff --staged --quiet || git commit -m "Update calendars $(date -u +%H:%M)"
          git pull --rebase origin main
          git push
