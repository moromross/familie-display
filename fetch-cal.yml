name: Fetch Calendars
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install recurring-ical-events icalendar

      - name: Fetch and filter calendars
        env:
          CAL1_URL: ${{ secrets.CAL1_URL }}
          CAL2_URL: ${{ secrets.CAL2_URL }}
          CALK1_URL: ${{ secrets.CALK1_URL }}
          CALK2_URL: ${{ secrets.CALK2_URL }}
          CALK3_URL: ${{ secrets.CALK3_URL }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          from icalendar import Calendar
          import recurring_ical_events

          BERLIN = ZoneInfo('Europe/Berlin')

          urls = [
            ("cal1.ics",  os.environ.get("CAL1_URL","")),
            ("cal2.ics",  os.environ.get("CAL2_URL","")),
            ("calk1.ics", os.environ.get("CALK1_URL","")),
            ("calk2.ics", os.environ.get("CALK2_URL","")),
            ("calk3.ics", os.environ.get("CALK3_URL","")),
          ]

          today = date.today()
          date_from = today - timedelta(days=1)
          date_to   = today + timedelta(days=9)

          def dt_str(val):
              if isinstance(val, datetime):
                  if val.tzinfo:
                      val = val.astimezone(BERLIN).replace(tzinfo=None)
                  return val.strftime('%Y%m%dT%H%M%S')
              return val.strftime('%Y%m%d')

          def esc_ical(s):
              return str(s).replace('\\', '\\\\').replace('\n', '\\n').replace(',', '\\,').replace(';', '\\;')

          for fname, url in urls:
              if not url:
                  open(fname,'w').write("BEGIN:VCALENDAR\r\nVERSION:2.0\r\nEND:VCALENDAR\r\n")
                  print(fname + ": no URL configured")
                  continue
              url = url.replace("webcal://","https://")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=30).read()
                  cal = Calendar.from_ical(data)
                  events = recurring_ical_events.of(cal).between(date_from, date_to)

                  lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Familie Display//DE"]
                  for ev in events:
                      lines.append("BEGIN:VEVENT")
                      dtstart = ev.get('DTSTART')
                      if dtstart:
                          lines.append("DTSTART:" + dt_str(dtstart.dt))
                      dtend = ev.get('DTEND')
                      if dtend:
                          lines.append("DTEND:" + dt_str(dtend.dt))
                      elif dtstart:
                          val = dtstart.dt
                          fallback = val + timedelta(hours=1) if isinstance(val, datetime) else val + timedelta(days=1)
                          lines.append("DTEND:" + dt_str(fallback))
                      summary = ev.get('SUMMARY', '')
                      lines.append("SUMMARY:" + esc_ical(summary))
                      desc = ev.get('DESCRIPTION', '')
                      if desc:
                          lines.append("DESCRIPTION:" + esc_ical(desc))
                      loc = ev.get('LOCATION', '')
                      if loc:
                          lines.append("LOCATION:" + esc_ical(loc))
                      lines.append("END:VEVENT")
                  lines.append("END:VCALENDAR")

                  open(fname, 'w', encoding='utf-8').write('\r\n'.join(lines) + '\r\n')
                  print(fname + ": " + str(len(events)) + " events")
              except Exception as e:
                  print(fname + " error: " + str(e))
                  open(fname,'w').write("BEGIN:VCALENDAR\r\nVERSION:2.0\r\nEND:VCALENDAR\r\n")
          PYEOF

      - name: Commit calendars
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add cal1.ics cal2.ics calk1.ics calk2.ics calk3.ics
          git diff --staged --quiet || git commit -m "Update calendars $(date -u +%H:%M)"
          git push
