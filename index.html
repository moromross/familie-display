<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Familie Display</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1612;font-family:'DM Sans',Helvetica,sans-serif;color:#1a1612;}

/* ════ GRID: 4 tiles ════ */
#grid{position:absolute;top:0;left:0;right:0;bottom:0;padding:5px;}
#tile-weather{position:absolute;top:5px;left:5px;width:calc(50% - 8px);height:calc(19% - 5px);border-radius:9px;overflow:hidden;background:#dff0f8;}
#tile-info{position:absolute;top:5px;right:5px;width:calc(50% - 8px);height:calc(19% - 5px);border-radius:9px;overflow:hidden;background:#f0f8e8;}
#tile-cal{position:absolute;top:19.5%;left:5px;right:5px;height:59%;border-radius:9px;overflow:hidden;background:#fff;}
#tile-sep{position:absolute;top:calc(19.5% + 59% + 3px);left:8px;right:8px;height:3px;background:#1a3a5c;border-radius:2px;}
#tile-faz{position:absolute;bottom:5px;left:5px;right:5px;height:calc(21.5% - 16px);border-radius:9px;overflow:hidden;background:#fff;}

/* fade layers inside tiles */
.layer{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;-webkit-transition:opacity .7s;transition:opacity .7s;}
.layer.on{opacity:1;}

/* ════ CALENDAR ════ */
#cal-tabs{position:absolute;top:0;left:0;right:0;height:38px;background:#1a3a5c;}
.ctab{float:left;width:33.33%;height:38px;text-align:center;color:rgba(255,255,255,.45);font-size:.7rem;font-weight:600;cursor:pointer;padding-top:4px;line-height:1.3;}
.ctab.on{color:#fff;border-bottom:3px solid #8b1a1a;}
.ctab small{font-size:.58rem;font-weight:400;opacity:.75;}
#cal-views{position:absolute;top:38px;left:0;right:0;bottom:0;}
.cview{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;visibility:hidden;-webkit-transition:opacity .5s;transition:opacity .5s;background:#fff;}
.cview.on{opacity:1;visibility:visible;}

/* day view */
.dv-heads{position:absolute;top:0;left:0;right:0;height:34px;border-bottom:1px solid #c8c2ba;background:#fff;z-index:5;}
.dvh-sp{float:left;width:34px;height:34px;border-right:1px solid #c8c2ba;}
.dvh{float:left;width:calc((100% - 34px)/4);height:34px;text-align:center;border-right:1px solid #e0dbd4;padding-top:3px;}
.dvh:last-child{border-right:none;}
.dvh-l{font-size:.45rem;text-transform:uppercase;letter-spacing:.08em;color:#9a9088;}
.dvh-n{font-family:'Playfair Display',serif;font-size:.8rem;color:#1a1612;white-space:nowrap;overflow:hidden;}
.dvh-d{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:2px;vertical-align:middle;}
.dv-scroll{position:absolute;top:34px;left:0;right:0;bottom:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;}
.dv-inner{position:relative;}
.dv-axis{position:absolute;top:0;left:0;width:34px;border-right:1px solid #c8c2ba;}
.dv-hm{position:absolute;left:0;right:0;border-top:1px solid #e0dbd4;}
.dv-hl{position:absolute;right:4px;top:-8px;font-family:'JetBrains Mono',monospace;font-size:.5rem;color:#9a9088;}
.dv-cols{position:absolute;top:0;left:34px;right:0;}
.dv-col{float:left;width:25%;position:relative;border-right:1px solid #e0dbd4;}
.dv-col:last-child{border-right:none;}
.dv-gl{position:absolute;left:0;right:0;border-top:1px solid #ece8e2;}
.redline{position:absolute;left:0;right:0;height:2px;background:#e02020;z-index:10;}
.redline:before{content:'';position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:#e02020;}
.ev{position:absolute;border-radius:3px;padding:2px 4px;overflow:hidden;border-left:3px solid;min-height:16px;}
.ev-t{font-family:'JetBrains Mono',monospace;font-size:.46rem;color:#5a5550;white-space:nowrap;}
.ev-s{font-size:.58rem;font-weight:600;color:#1a1612;line-height:1.2;}
.ev-d{font-size:.5rem;color:#5a5550;line-height:1.2;}
.ev-b{font-size:.42rem;font-weight:700;text-transform:uppercase;opacity:.7;}

/* weekend view */
.wk-cols{position:absolute;top:0;left:0;right:0;bottom:0;}
.wk-col{float:left;width:50%;height:100%;position:relative;border-right:1px solid #e0dbd4;}
.wk-col:last-child{border-right:none;}
.wk-head{position:absolute;top:0;left:0;right:0;height:26px;background:#fff9c4;border-bottom:1px solid #e8e0a0;padding:4px 8px;font-family:'Playfair Display',serif;font-size:.78rem;color:#1a1612;white-space:nowrap;overflow:hidden;}
.wk-head small{font-size:.6rem;color:#5a5020;margin-left:5px;}
.wk-scroll{position:absolute;top:26px;left:0;right:0;bottom:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:5px;}
.wk-ev{margin-bottom:4px;border-radius:4px;padding:4px 6px;border-left:3px solid;}
.wk-ev-t{font-family:'JetBrains Mono',monospace;font-size:.5rem;color:#9a9088;}
.wk-ev-s{font-size:.62rem;font-weight:600;color:#1a1612;line-height:1.25;}
.wk-none{font-size:.62rem;color:#9a9088;font-style:italic;padding:6px;}

/* ════ FAZ ════ */
.faz-l{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;-webkit-transition:opacity .7s;transition:opacity .7s;padding:7px 12px;overflow:hidden;}
.faz-l.on{opacity:1;}
.faz-r{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#8b1a1a;font-weight:600;margin-bottom:4px;}
.faz-i{float:left;width:48%;margin-right:2%;overflow:hidden;height:calc(100% - 24px);}
.faz-ti{font-family:'Playfair Display',serif;font-size:.88rem;line-height:1.25;color:#1a1612;margin-bottom:2px;}
.faz-de{font-size:.62rem;color:#5a5550;line-height:1.35;overflow:hidden;}

/* ════ SETTINGS ════ */
#sett{display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:500;background:#f5f1eb;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:14px;padding-top:54px;padding-bottom:60px;}
#sett.on{display:block;}
.st{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:14px;}
.ss{background:#fff;border-radius:10px;padding:13px;margin-bottom:11px;border:1px solid #c8c2ba;}
.ss h3{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#9a9088;margin-bottom:10px;}
.sf{margin-bottom:9px;}
.sl{font-size:.74rem;color:#5a5550;margin-bottom:3px;display:block;}
.si{width:100%;padding:9px 10px;border:1px solid #c8c2ba;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.85rem;color:#1a1612;background:#fff;}
.sr{overflow:hidden;}
.sw{float:left;width:28px;height:28px;border-radius:5px;margin-right:6px;border:none;padding:0;}
.sr .si{width:calc(100% - 36px);float:left;}
.sh2{font-size:.65rem;color:#9a9088;margin-top:3px;line-height:1.4;clear:both;padding-top:2px;}
.sb{width:100%;padding:13px;background:#1a1612;color:#fff;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:600;margin-top:5px;display:block;text-align:center;-webkit-appearance:none;}
#sc{position:fixed;top:10px;right:12px;background:#1a1612;color:#fff;border:none;border-radius:7px;padding:9px 15px;font-size:.74rem;z-index:600;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
#gear{position:absolute;bottom:8px;right:8px;z-index:100;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);text-align:center;line-height:34px;font-size:.85rem;}
</style>
</head>
<body>

<div id="grid">
  <div id="tile-weather">
    <div class="layer on" id="ly-weather"></div>
    <div class="layer" id="ly-sail"></div>
  </div>
  <div id="tile-info">

    <div class="sf"><label class="sl">Kind 3 Name</label><input class="si" id="i-n3" type="text"></div>
    <div class="sf"><label class="sl">Kind 3 Synonyme</label><input class="si" id="i-s3" type="text"></div>

    <div class="sf"><label class="sl">Familienkalender 1</label><input type="color" class="sw" id="i-cf1" value="#2171b5" style="float:none"></div>

  <div class="ss">

      </select></div>

      <select class="si" id="i-st2">
        <option value="SH">Schleswig-Holstein</option><option value="HH">Hamburg</option>
        <option value="BY">Bayern</option><option value="NW">Nordrhein-Westfalen</option>
        <option value="NI">Niedersachsen</option><option value="BE">Berlin</option>
        <option value="HE">Hessen</option><option value="BW">Baden-Württemberg</option>
      </select></div>
  </div>
  <div class="sb" id="sv">💾 Speichern &amp; Starten</div>
</div>

<script>
// ════════ CONFIG ════════
var cfg={
  n1:'Kind 1',n2:'Kind 2',n3:'Kind 3',
  s1:'',s2:'',s3:'',
  c1:'#6a51a3',c2:'#31a354',c3:'#d94701',
  cf1:'#2171b5',cf2:'#e6550d',
  city:'Wohltorf',sail:'Kiel',st1:'SH',st2:'HH'
};
function loadCfg(){try{var s=localStorage.getItem('fd6');if(s){var o=JSON.parse(s);for(var k in o)cfg[k]=o[k];}}catch(e){}}
function saveCfg(){
  cfg.n1=val('i-n1')||'Kind 1';cfg.n2=val('i-n2')||'Kind 2';cfg.n3=val('i-n3')||'Kind 3';
  cfg.s1=val('i-s1');cfg.s2=val('i-s2');cfg.s3=val('i-s3');
  cfg.c1=val('i-c1');cfg.c2=val('i-c2');cfg.c3=val('i-c3');
  cfg.cf1=val('i-cf1');cfg.cf2=val('i-cf2');
  cfg.city=val('i-city')||'Wohltorf';cfg.sail=val('i-sail')||'Kiel';
  cfg.st1=val('i-st1');cfg.st2=val('i-st2');
  try{localStorage.setItem('fd6',JSON.stringify(cfg));}catch(e){}
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function p2(n){return n<10?'0'+n:''+n;}
function ft(d){return p2(d.getHours())+':'+p2(d.getMinutes());}
function rgba(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}
var DAY=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var DS=['So','Mo','Di','Mi','Do','Fr','Sa'];
var MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var HH=64;
var allEvents=[];

// ════════ WAKE LOCK (silent video) ════════
function keepAwake(){
  var v=document.createElement('video');
  v.setAttribute('loop','');v.setAttribute('muted','');v.setAttribute('playsinline','');
  v.muted=true;
  v.style.cssText='position:absolute;width:2px;height:2px;opacity:0.01;top:0;left:0;pointer-events:none;';
  v.src='data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAA/BtZGF0AAACrAYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OCByMjY0MyA1YzY1NzA0IC0gSC4yNjQvTVBFRy00IEFWQSBDT0RFQyAtIENvcHlsZWZ0IDIwMDMtMjAxNQ==';
  document.body.appendChild(v);
  try{v.play();}catch(e){}
  setInterval(function(){try{v.play();}catch(e){}},25000);
}

// ════════ DATA: FERIEN ════════
var FERIEN={
  SH:[{n:'Sommerferien',s:'2025-06-26',e:'2025-08-06'},{n:'Herbstferien',s:'2025-10-06',e:'2025-10-18'},{n:'Weihnachtsferien',s:'2025-12-22',e:'2026-01-06'},{n:'Winterferien',s:'2026-02-02',e:'2026-02-13'},{n:'Osterferien',s:'2026-03-25',e:'2026-04-09'},{n:'Sommerferien',s:'2026-06-25',e:'2026-08-05'}],
  HH:[{n:'Sommerferien',s:'2025-07-10',e:'2025-08-20'},{n:'Herbstferien',s:'2025-10-03',e:'2025-10-17'},{n:'Weihnachtsferien',s:'2025-12-19',e:'2026-01-02'},{n:'Osterferien',s:'2026-03-12',e:'2026-03-27'},{n:'Sommerferien',s:'2026-07-02',e:'2026-08-12'}],
  BY:[{n:'Sommerferien',s:'2025-07-28',e:'2025-09-10'},{n:'Herbstferien',s:'2025-10-27',e:'2025-10-31'},{n:'Weihnachtsferien',s:'2025-12-24',e:'2026-01-05'},{n:'Osterferien',s:'2026-04-09',e:'2026-04-24'},{n:'Sommerferien',s:'2026-07-30',e:'2026-09-14'}],
  NW:[{n:'Sommerferien',s:'2025-06-23',e:'2025-08-05'},{n:'Herbstferien',s:'2025-10-13',e:'2025-10-25'},{n:'Weihnachtsferien',s:'2025-12-22',e:'2026-01-06'},{n:'Osterferien',s:'2026-03-26',e:'2026-04-11'},{n:'Sommerferien',s:'2026-06-22',e:'2026-08-04'}],
  NI:[{n:'Sommerferien',s:'2025-06-26',e:'2025-08-06'},{n:'Herbstferien',s:'2025-10-06',e:'2025-10-18'},{n:'Weihnachtsferien',s:'2025-12-22',e:'2026-01-05'},{n:'Osterferien',s:'2026-03-25',e:'2026-04-09'},{n:'Sommerferien',s:'2026-06-25',e:'2026-08-05'}],
  BE:[{n:'Sommerferien',s:'2025-06-19',e:'2025-08-01'},{n:'Herbstferien',s:'2025-10-20',e:'2025-11-01'},{n:'Weihnachtsferien',s:'2025-12-22',e:'2026-01-02'},{n:'Osterferien',s:'2026-03-26',e:'2026-04-09'},{n:'Sommerferien',s:'2026-06-25',e:'2026-08-07'}],
  HE:[{n:'Sommerferien',s:'2025-07-07',e:'2025-08-15'},{n:'Herbstferien',s:'2025-10-20',e:'2025-11-01'},{n:'Weihnachtsferien',s:'2025-12-22',e:'2026-01-10'},{n:'Osterferien',s:'2026-03-30',e:'2026-04-11'},{n:'Sommerferien',s:'2026-07-06',e:'2026-08-14'}],
  BW:[{n:'Sommerferien',s:'2025-07-31',e:'2025-09-13'},{n:'Herbstferien',s:'2025-10-27',e:'2025-11-01'},{n:'Weihnachtsferien',s:'2025-12-22',e:'2026-01-05'},{n:'Osterferien',s:'2026-04-01',e:'2026-04-18'},{n:'Sommerferien',s:'2026-07-30',e:'2026-09-12'}]
};
var STN={SH:'Schleswig-Holstein',HH:'Hamburg',BY:'Bayern',BW:'Baden-Württemberg',NW:'NRW',HE:'Hessen',NI:'Niedersachsen',BE:'Berlin'};
function nextFerien(code){
  var t=new Date();t.setHours(0,0,0,0);
  var l=FERIEN[code]||FERIEN.SH;
  for(var i=0;i<l.length;i++){
    var s=new Date(l[i].s),e=new Date(l[i].e);e.setHours(23,59,59);
    if(e>=t)return{name:l[i].n,start:s,end:e,days:Math.max(0,Math.ceil((s-t)/86400000)),inF:t>=s};
  }
  return null;
}
function rWeeks(d){
  if(d<=0)return{w:'jetzt',e:''};
  if(d<=6)return{w:d+' Tag'+(d===1?'':'e'),e:''};
  var w=Math.ceil(d/7);
  return{w:w+' Woche'+(w===1?'':'n'),e:d+' Tage genau'};
}

// ════════ WEATHER ════════
function wIcon(c){if(c===0)return'☀️';if(c<=2)return'⛅';if(c<=3)return'☁️';if(c<=49)return'🌫️';if(c<=59)return'🌦️';if(c<=69)return'🌧️';if(c<=79)return'🌨️';if(c<=82)return'🌧️';return'⛈️';}
function wDesc(c){if(c===0)return'Sonnig';if(c<=2)return'Leicht bewölkt';if(c<=3)return'Bedeckt';if(c<=49)return'Neblig';if(c<=59)return'Niesel';if(c<=69)return'Regen';if(c<=79)return'Schnee';return'Gewitter';}
function bftCol(b){
  var c=['#ffffff','#e0e0e0','#b8d4e8','#80b8f0','#40c040','#c8a000','#e07800','#e03000','#c00000','#a00000','#800080','#600060','#400040'];
  return c[Math.min(b,12)];
}
function kn2bft(k){if(k<1)return 0;if(k<4)return 1;if(k<7)return 2;if(k<11)return 3;if(k<17)return 4;if(k<22)return 5;if(k<28)return 6;if(k<34)return 7;if(k<41)return 8;if(k<48)return 9;if(k<56)return 10;if(k<64)return 11;return 12;}
function wArrow(deg,col){
  var r=(deg+180)%360;
  return '<svg width="14" height="14" viewBox="0 0 20 20"><g transform="rotate('+r+',10,10)"><line x1="10" y1="17" x2="10" y2="5" stroke="'+col+'" stroke-width="2.5" stroke-linecap="round"/><polyline points="5,10 10,3 15,10" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g></svg>';
}
function xhrGet(url,ok,fail){
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200)ok(x.responseText);else if(fail)fail();}};
  x.onerror=function(){if(fail)fail();};
  x.timeout=20000;
  x.ontimeout=function(){if(fail)fail();};
  x.send();
}
// Known coordinates - no geocoding needed
var COORDS={
  'wohltorf':{latitude:53.52,longitude:10.33,name:'Wohltorf'},

function getCoords(city,cb){
  var key=city.toLowerCase().replace(/[^a-zäöü]/g,'');
  if(COORDS[key]){cb(COORDS[key]);return;}
  // Fallback: geocode API
  xhrGet('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=de&format=json',
    function(t){try{var d=JSON.parse(t);cb(d.results&&d.results.length?d.results[0]:null);}catch(e){cb(null);}},
    function(){cb(null);});
}

function getWeather(city,cb){
  getCoords(city,function(loc){
    if(!loc){cb(null,null);return;}
    var u='https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude
      +'&current=temperature_2m,weather_code,precipitation_probability'
      +'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,weather_code'
      +'&hourly=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code'
      +'&wind_speed_unit=kn&timezone=Europe%2FBerlin&forecast_days=9';
    xhrGet(u,function(t){
      try{
        var d=JSON.parse(t);
        // Normalize API response keys (Open-Meteo sometimes uses underscores)
        if(d.current){
          if(d.current.weather_code!==undefined&&d.current.weathercode===undefined)d.current.weathercode=d.current.weather_code;
          if(d.current.precipitation_probability===undefined)d.current.precipitation_probability=0;
        }
        if(d.daily){
          if(d.daily.weather_code&&!d.daily.weathercode)d.daily.weathercode=d.daily.weather_code;
          if(d.daily.wind_speed_10m_max&&!d.daily.windspeed_10m_max)d.daily.windspeed_10m_max=d.daily.wind_speed_10m_max;
        }
        if(d.hourly){
          if(d.hourly.wind_speed_10m&&!d.hourly.windspeed_10m)d.hourly.windspeed_10m=d.hourly.wind_speed_10m;
          if(d.hourly.wind_gusts_10m&&!d.hourly.windgusts_10m)d.hourly.windgusts_10m=d.hourly.wind_gusts_10m;
          if(d.hourly.wind_direction_10m&&!d.hourly.winddirection_10m)d.hourly.winddirection_10m=d.hourly.wind_direction_10m;
          if(d.hourly.weather_code&&!d.hourly.weathercode)d.hourly.weathercode=d.hourly.weather_code;
        }
        cb(loc,d);
      }catch(e){cb(null,null);}
    },function(){cb(null,null);});
  });
}

function fetchIcs(file,calId,color,cb){
  xhrGet(file+'?t='+(new Date().getTime()),
    function(t){
      if(t.indexOf('BEGIN:VCALENDAR')>-1)cb(parseIcal(t,calId,color));
      else cb([]);
    },
    function(){cb([]);});
}
function parseIcal(txt,calId,color){
  var evs=[],blocks=txt.split('BEGIN:VEVENT');
  for(var i=1;i<blocks.length;i++){
    try{
      var blk=blocks[i];
      var get=function(k){var m=blk.match(new RegExp(k+'[^:]*:([^\\r\\n]+)','i'));return m?m[1].trim().replace(/\r?\n[ \t]/g,' '):'';};
      var sum=unI(get('SUMMARY')),desc=unI(get('DESCRIPTION')),loc=unI(get('LOCATION'));
      var ds=get('DTSTART'),de=get('DTEND');
      if(!sum||!ds)continue;
      var st=pDt(ds),en=de?pDt(de):new Date(st.getTime()+3600000);
      var aD=ds.replace(/[TZ]/g,'').length===8;
      evs.push({summary:sum,desc:desc,location:loc,start:st,end:en,allDay:aD,calId:calId,color:color});
    }catch(e){}
  }
  return evs;
}
function unI(s){return s.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';');}
function pDt(s){s=s.replace('Z','').replace('T','');return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+(s.slice(8,10)||0),+(s.slice(10,12)||0));}

function refreshCals(cb){
  var files=[
    {f:'cal1.ics',id:'f1',c:cfg.cf1},{f:'cal2.ics',id:'f2',c:cfg.cf2},
    {f:'calk1.ics',id:'k1',c:cfg.c1},{f:'calk2.ics',id:'k2',c:cfg.c2},{f:'calk3.ics',id:'k3',c:cfg.c3}
  ];
  var pend=files.length,res=[];
  for(var i=0;i<files.length;i++){
    (function(fl){
      fetchIcs(fl.f,fl.id,fl.c,function(evs){
        for(var j=0;j<evs.length;j++)res.push(evs[j]);
        pend--;
        if(pend===0){
          res.sort(function(a,b){return a.start-b.start;});
          allEvents=res;
          if(cb)cb();
        }
      });
    })(files[i]);
  }
}

// ════════ CALENDAR RENDER ════════
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function soD(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function eoD(d){var x=new Date(d);x.setHours(23,59,59,999);return x;}

function kidTerms(num){
  var n=num===1?cfg.n1:num===2?cfg.n2:cfg.n3;
  var sy=num===1?cfg.s1:num===2?cfg.s2:cfg.s3;
  var t=[];
  if(n&&n.replace(/\s/g,''))t.push(n.toLowerCase());
  if(sy){var p=sy.split(',');for(var i=0;i<p.length;i++){var s=p[i].replace(/^\s+|\s+$/g,'');if(s)t.push(s.toLowerCase());}}
  return t;
}
function childCopies(evts){
  var kids=[{id:'k1',num:1,c:cfg.c1},{id:'k2',num:2,c:cfg.c2},{id:'k3',num:3,c:cfg.c3}];
  var out=[];
  for(var i=0;i<evts.length;i++){
    var ev=evts[i];
    if(ev.calId!=='f1'&&ev.calId!=='f2')continue;
    var hay=(ev.summary+' '+(ev.desc||'')+' '+(ev.location||'')).toLowerCase();
    for(var j=0;j<kids.length;j++){
      var terms=kidTerms(kids[j].num),hit=false;
      for(var ti=0;ti<terms.length;ti++){if(hay.indexOf(terms[ti])>-1){hit=true;break;}}
      if(hit)out.push({summary:ev.summary,desc:ev.desc,location:ev.location,start:ev.start,end:ev.end,allDay:ev.allDay,calId:kids[j].id,color:kids[j].c,isCopy:true,oc:ev.color});
    }
  }
  return out;
}
function layoutEvts(evts){
  var so=evts.slice().sort(function(a,b){return a.start-b.start;});
  var grp=[];
  for(var i=0;i<so.length;i++){
    var ev=so[i],pl=false;
    for(var gi=0;gi<grp.length;gi++){
      var g=grp[gi],ge=0;
      for(var t=0;t<g.length;t++)for(var e2=0;e2<g[t].length;e2++)if(g[t][e2].end.getTime()>ge)ge=g[t][e2].end.getTime();
      if(ev.start.getTime()<ge){
        var ft2=-1;
        for(var t2=0;t2<g.length;t2++){if(g[t2][g[t2].length-1].end.getTime()<=ev.start.getTime()){ft2=t2;break;}}
        if(ft2===-1)g.push([ev]);else g[ft2].push(ev);
        pl=true;break;
      }
    }
    if(!pl)grp.push([[ev]]);
  }
  var res=[];
  for(var gi2=0;gi2<grp.length;gi2++){var g2=grp[gi2];for(var t3=0;t3<g2.length;t3++)for(var e3=0;e3<g2[t3].length;e3++)res.push({ev:g2[t3][e3],sub:t3,tot:g2.length});}
  return res;
}

function buildDay(viewId,date,minH,maxH,redline){
  var v=el(viewId);
  var totalPx=(maxH-minH)*HH;
  var heads='<div class="dv-heads">'
    +'<div class="dvh-sp"></div>'

    +'<div class="dvh"><div class="dvh-l">&nbsp;</div><div class="dvh-n"><span class="dvh-d" style="background:'+cfg.c2+'"></span>'+esc(cfg.n2)+'</div></div>'
    +'<div class="dvh"><div class="dvh-l">&nbsp;</div><div class="dvh-n"><span class="dvh-d" style="background:'+cfg.c3+'"></span>'+esc(cfg.n3)+'</div></div>'
    +'<div style="clear:both"></div></div>';
  var axis='';
  for(var h=minH;h<=maxH;h++){
    axis+='<div class="dv-hm" style="top:'+((h-minH)*HH)+'px"><span class="dv-hl">'+p2(h)+'</span></div>';
  }
  var gl='';
  for(var h2=minH;h2<=maxH;h2++)gl+='<div class="dv-gl" style="top:'+((h2-minH)*HH)+'px"></div>';

  var red='';
  if(redline){
    var now=new Date();
    var nh=now.getHours()+now.getMinutes()/60;
    if(nh>=minH&&nh<=maxH)red='<div class="redline" style="top:'+((nh-minH)*HH)+'px"></div>';
  }

  // events
  var dayEvts=[];
  for(var i=0;i<allEvents.length;i++){
    var e=allEvents[i];
    if(sameDay(e.start,date)||(!e.allDay&&e.start<=eoD(date)&&e.end>soD(date)))dayEvts.push(e);
  }
  var all=dayEvts.concat(childCopies(dayEvts));
  var byc={fam:[],k1:[],k2:[],k3:[]};
  for(var i2=0;i2<all.length;i2++){var ck=colKey(all[i2].calId);if(byc[ck])byc[ck].push(all[i2]);}

  function evHtml(list){
    var laid=layoutEvts(list),out='';
    for(var li=0;li<laid.length;li++){
      var L=laid[li],ev=L.ev;
      var sm,em;
      if(ev.allDay){sm=minH*60;em=Math.min(maxH*60,minH*60+90);}
      else{
        var es=ev.start<soD(date)?soD(date):ev.start;
        var ee=ev.end>eoD(date)?eoD(date):ev.end;
        sm=Math.max(es.getHours()*60+es.getMinutes(),minH*60);
        em=Math.min(ee.getHours()*60+ee.getMinutes(),maxH*60);
      }
      if(em<=sm)continue;
      var top=((sm/60)-minH)*HH;
      var hh=Math.max(16,((em-sm)/60)*HH-2);
      var pct=100/L.tot;
      var ts=ev.allDay?'Ganztag':ft(ev.start);
      var det='';
      if(ev.desc){var ls=ev.desc.split(/\n/);var pp=[];for(var x=0;x<Math.min(ls.length,2);x++){var l2=ls[x].replace(/^\s+|\s+$/g,'');if(l2)pp.push(esc(l2));}if(pp.length)det='<div class="ev-d">'+pp.join(' · ')+'</div>';}
      var badge=ev.isCopy?'<div class="ev-b" style="color:'+ev.oc+'">Fam.Kal</div>':'';
      var bs=ev.isCopy?'dashed':'solid';
      out+='<div class="ev" style="top:'+top+'px;height:'+hh+'px;left:'+(L.sub*pct)+'%;width:'+pct+'%;border-left-color:'+ev.color+';border-left-style:'+bs+';background:'+rgba(ev.color,ev.isCopy?0.05:0.09)+'">'
        +'<div class="ev-t">'+ts+'</div><div class="ev-s">'+esc(ev.summary)+'</div>'+badge+det+'</div>';
    }
    return out;
  }

  v.innerHTML=heads
    +'<div class="dv-scroll"><div class="dv-inner" style="height:'+totalPx+'px">'
    +'<div class="dv-axis" style="height:'+totalPx+'px">'+axis+'</div>'
    +red
    +'<div class="dv-cols" style="height:'+totalPx+'px">'
    +'<div class="dv-col" style="height:'+totalPx+'px">'+gl+evHtml(byc.fam)+'</div>'
    +'<div class="dv-col" style="height:'+totalPx+'px">'+gl+evHtml(byc.k1)+'</div>'
    +'<div class="dv-col" style="height:'+totalPx+'px">'+gl+evHtml(byc.k2)+'</div>'
    +'<div class="dv-col" style="height:'+totalPx+'px">'+gl+evHtml(byc.k3)+'</div>'
    +'<div style="clear:both"></div></div>'
    +'</div></div>';

  // scroll positioning for heute
  if(redline){
    var sw=v.querySelector('.dv-scroll');
    var now2=new Date();
    var nowPx=(now2.getHours()+now2.getMinutes()/60-minH)*HH;
    setTimeout(function(){
      if(!sw)return;
      var vh=sw.clientHeight;
      var ideal=nowPx-vh*0.33;
      var maxS=totalPx-vh;
      sw.scrollTop=Math.max(0,Math.min(ideal,maxS));
    },80);
  }
}

function buildWknd(viewId){
  var v=el(viewId);
  var today=new Date();
  var dSat=(6-today.getDay()+7)%7||7;
  var sat=new Date(today);sat.setDate(today.getDate()+dSat);
  var sun=new Date(sat);sun.setDate(sat.getDate()+1);
  function col(d){
    var evs=[];
    for(var i=0;i<allEvents.length;i++){
      var e=allEvents[i];
      if((e.calId==='f1'||e.calId==='f2')&&sameDay(e.start,d))evs.push(e);
    }
    evs.sort(function(a,b){return a.start-b.start;});
    var h='<div class="wk-col"><div class="wk-head">'+DAY[d.getDay()]+'<small>'+d.getDate()+'. '+MS[d.getMonth()]+'.</small></div><div class="wk-scroll">';
    if(!evs.length)h+='<div class="wk-none">Keine Termine</div>';
    else for(var i2=0;i2<evs.length;i2++){
      var e2=evs[i2],ts=e2.allDay?'Ganztag':ft(e2.start);
      h+='<div class="wk-ev" style="border-left-color:'+e2.color+';background:'+rgba(e2.color,.08)+'"><div class="wk-ev-t">'+ts+'</div><div class="wk-ev-s">'+esc(e2.summary)+'</div></div>';
    }
    h+='</div></div>';
    return h;
  }
  v.innerHTML='<div class="wk-cols">'+col(sat)+col(sun)+'<div style="clear:both"></div></div>';
}

function renderCal(){
  var now=new Date();
  var tom=new Date(now);tom.setDate(now.getDate()+1);
  var startH=Math.max(0,now.getHours()-1);
  buildDay('cv-heute',now,startH,23,true);
  buildDay('cv-morgen',tom,7,21,false);
  buildWknd('cv-wknd');
  // tab labels
  var dSat=(6-now.getDay()+7)%7||7;
  var sat=new Date(now);sat.setDate(now.getDate()+dSat);
  var sun=new Date(sat);sun.setDate(sat.getDate()+1);
  el('ct-heute').innerHTML='HEUTE<br><small>&nbsp;'+DS[now.getDay()]+', '+now.getDate()+'. '+MS[now.getMonth()]+'.</small>';
  el('ct-morgen').innerHTML='MORGEN<br><small>&nbsp;'+DS[tom.getDay()]+', '+tom.getDate()+'. '+MS[tom.getMonth()]+'.</small>';
  el('ct-wknd').innerHTML='WOCHENENDE<br><small>&nbsp;'+sat.getDate()+'./'+sun.getDate()+'. '+MS[sat.getMonth()]+'.</small>';
}

// cal tab switching + cycle
var calView='heute',calFrozen=false,calCycleIdx=0,calTimer=null;
var calViews=['heute','morgen','wknd'];
function switchCal(view){
  calView=view;
  for(var i=0;i<calViews.length;i++){
    el('ct-'+calViews[i]).className='ctab'+(calViews[i]===view?' on':'');
    el('cv-'+calViews[i]).className='cview'+(calViews[i]===view?' on':'');
    if(calViews[i]===view)calCycleIdx=i;
  }
  if(view==='heute'){
    setTimeout(function(){
      var sw=el('cv-heute').querySelector('.dv-scroll');
      if(!sw)return;
      var now=new Date();
      var startH=Math.max(0,now.getHours()-1);
      var nowPx=(now.getHours()+now.getMinutes()/60-startH)*HH;
      var vh=sw.clientHeight;
      var inner=sw.querySelector('.dv-inner');
      var maxS=(inner?inner.offsetHeight:0)-vh;
      sw.scrollTop=Math.max(0,Math.min(nowPx-vh*0.33,maxS));
    },60);
  }
}
function startCalCycle(){
  if(calTimer)clearInterval(calTimer);
  if(calFrozen)return;
  calTimer=setInterval(function(){
    if(calFrozen)return;
    calCycleIdx=(calCycleIdx+1)%calViews.length;
    switchCal(calViews[calCycleIdx]);
  },5000);
}

// ════════ FAZ ════════
var FAZ=[
  {u:'https://www.faz.net/rss/aktuell/politik/',l:'Politik'},
  {u:'https://www.faz.net/rss/aktuell/wirtschaft/',l:'Wirtschaft'},
  {u:'https://www.faz.net/rss/aktuell/sport/',l:'Sport'},
  {u:'https://www.faz.net/rss/aktuell/feuilleton/',l:'Feuilleton'},
  {u:'https://www.faz.net/rss/aktuell/gesellschaft/',l:'Gesellschaft'},
  {u:'https://www.faz.net/rss/aktuell/wissen/',l:'Wissen'}
];
var fazData=[],fazIdx=0,fazTimer=null,fazFrozen=false;
function fetchFAZ(cb){
  var rem=FAZ.length;fazData=[];
  for(var i=0;i<FAZ.length;i++){
    (function(idx,fd){
      xhrGet('https://corsproxy.io/?'+encodeURIComponent(fd.u),
        function(t){
          var arts=[];
          try{
            var xml=new DOMParser().parseFromString(t,'text/xml');
            var items=xml.getElementsByTagName('item');
            for(var j=0;j<Math.min(items.length,2);j++){
              var it=items[j];
              var gT=function(tag){var e=it.getElementsByTagName(tag);return e.length?e[0].textContent||e[0].text||'':'';};
              arts.push({t:gT('title'),d:gT('description').replace(/<[^>]+>/g,''),r:fd.l});
            }
          }catch(e){}
          fazData[idx]={l:fd.l,a:arts};
          rem--;if(rem===0&&cb)cb();
        },
        function(){fazData[idx]={l:fd.l,a:[]};rem--;if(rem===0&&cb)cb();});
    })(i,FAZ[i]);
  }
}
function renderFAZ(){
  var t=el('tile-faz');
  var h='';
  for(var i=0;i<fazData.length;i++){
    var fd=fazData[i];
    if(!fd||!fd.a.length)continue;
    h+='<div class="faz-l'+(h===''?' on':'')+'">'
      +'<div class="faz-r">FAZ — '+esc(fd.l)+'</div>';
    for(var j=0;j<Math.min(fd.a.length,2);j++){
      var a=fd.a[j];
      h+='<div class="faz-i"><div class="faz-ti">'+esc(a.t)+'</div><div class="faz-de">'+esc(a.d.slice(0,110))+'</div></div>';
    }
    h+='<div style="clear:both"></div></div>';
  }
  t.innerHTML=h||'<div style="padding:14px;font-size:.7rem;color:#9a9088">Nachrichten werden geladen…</div>';
  startFazCycle();
}
function startFazCycle(){
  if(fazTimer)clearInterval(fazTimer);
  fazIdx=0;
  if(fazFrozen)return;
  fazTimer=setInterval(function(){
    if(fazFrozen)return;
    var ls=el('tile-faz').getElementsByClassName('faz-l');
    if(!ls.length)return;
    for(var i=0;i<ls.length;i++)ls[i].className='faz-l';
    fazIdx=(fazIdx+1)%ls.length;
    ls[fazIdx].className='faz-l on';
  },8000);
}

// ════════ TILE CYCLES ════════
var wState=0,wTimer=null,wFrozen=false;
function startWCycle(){
  if(wTimer)clearInterval(wTimer);
  if(wFrozen)return;
  wTimer=setInterval(function(){
    if(wFrozen)return;
    wState=1-wState;
    el('ly-weather').className='layer'+(wState===0?' on':'');
    el('ly-sail').className='layer'+(wState===1?' on':'');
  },4000);
}
var iState=0,iTimer=null,iFrozen=false;
function startICycle(){
  if(iTimer)clearInterval(iTimer);
  if(iFrozen)return;
  iTimer=setInterval(function(){
    if(iFrozen)return;
    iState=1-iState;
    el('ly-ferien').className='layer'+(iState===0?' on':'');
    el('ly-bday').className='layer'+(iState===1?' on':'');
  },4000);
}

// ════════ SETTINGS ════════
function openSett(){
  el('i-n1').value=cfg.n1;el('i-n2').value=cfg.n2;el('i-n3').value=cfg.n3;
  el('i-s1').value=cfg.s1;el('i-s2').value=cfg.s2;el('i-s3').value=cfg.s3;
  el('i-c1').value=cfg.c1;el('i-c2').value=cfg.c2;el('i-c3').value=cfg.c3;
  el('i-cf1').value=cfg.cf1;el('i-cf2').value=cfg.cf2;
  el('i-city').value=cfg.city;el('i-sail').value=cfg.sail;
  el('i-st1').value=cfg.st1;el('i-st2').value=cfg.st2;
  el('sett').className='on';
}
function closeSett(){
  el('sett').className='';
  saveCfg();
  initData();
}

// ════════ TOUCH ════════
function tap(id,fn){
  var e=el(id);if(!e)return;
  e.addEventListener('touchend',function(ev){ev.preventDefault();ev.stopPropagation();fn();},false);
  e.addEventListener('click',function(ev){ev.stopPropagation();fn();},false);
}
tap('gear',openSett);
tap('sc',closeSett);
tap('sv',closeSett);
tap('ct-heute',function(){calFrozen=!calFrozen;if(!calFrozen)startCalCycle();switchCal('heute');});
tap('ct-morgen',function(){calFrozen=!calFrozen;if(!calFrozen)startCalCycle();switchCal('morgen');});
tap('ct-wknd',function(){calFrozen=!calFrozen;if(!calFrozen)startCalCycle();switchCal('wknd');});
el('tile-weather').addEventListener('touchend',function(e){if(e.target.id==='gear')return;wFrozen=!wFrozen;if(!wFrozen)startWCycle();},false);
el('tile-info').addEventListener('touchend',function(e){iFrozen=!iFrozen;if(!iFrozen)startICycle();},false);
el('tile-faz').addEventListener('touchend',function(e){fazFrozen=!fazFrozen;if(!fazFrozen)startFazCycle();},false);

// ════════ INIT & TIMERS ════════
function initData(){
  refreshCals(function(){renderInfo();renderCal();});
  getWeather(cfg.city,function(l,d){wHomeLoc=l;wHome=d;renderWeather();});
  getWeather(cfg.sail,function(l,d){wSailLoc=l;wSail=d;renderWeather();});
  fetchFAZ(function(){renderFAZ();});
}

loadCfg();
keepAwake();
initData();
startWCycle();
startICycle();
startCalCycle();

// Calendars every 5 min
setInterval(function(){refreshCals(function(){renderInfo();renderCal();});},5*60*1000);
// Weather every 15 min
setInterval(function(){
  getWeather(cfg.city,function(l,d){wHomeLoc=l;wHome=d;renderWeather();});
  getWeather(cfg.sail,function(l,d){wSailLoc=l;wSail=d;renderWeather();});
},15*60*1000);
// FAZ every 10 min
setInterval(function(){fetchFAZ(function(){renderFAZ();});},10*60*1000);
// Red line + scroll every minute (only heute view rebuild)
setInterval(function(){
  var now=new Date();
  var startH=Math.max(0,now.getHours()-1);
  buildDay('cv-heute',now,startH,23,true);
},60*1000);
// Midnight reset
var lastD=new Date().getDate();
setInterval(function(){
  var n=new Date();
  if(n.getDate()!==lastD){
    lastD=n.getDate();
    initData();
  }
},60*1000);
</script>
