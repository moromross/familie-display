<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Familie Display</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap');
:root{
  --bg:#1a1612;--paper:#fff;--ink:#1a1612;--ink2:#5a5550;--ink3:#9a9088;
  --rule:#e0dbd4;--rule2:#c8c2ba;--accent:#8b1a1a;
  --blue:#1a3a5c;--green:#1a4a2a;
  --col-fam1:#2171b5;--col-fam2:#e6550d;
  --col-k1:#6a51a3;--col-k2:#31a354;--col-k3:#d94701;
  --gap:6px;--radius:10px;
  --hour-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);}

/* ── GRID ── */
#grid{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;
  gap:var(--gap);padding:var(--gap);
  background:var(--bg);
}
#row-top{
  height:20%;-webkit-flex-shrink:0;flex-shrink:0;
  display:-webkit-flex;display:flex;gap:var(--gap);
}
#row-mid{
  height:65%;-webkit-flex-shrink:0;flex-shrink:0;
  position:relative;
}
#row-bot{
  height:calc(15% - var(--gap)*2);-webkit-flex-shrink:0;flex-shrink:0;
}

/* ── TILE BASE ── */
.tile{
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  background:#fff;
}
.tile-frozen .fade-layer{ -webkit-animation:none!important; animation:none!important; opacity:1!important; }

/* ── FADE LAYERS ── */
.fade-layer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  opacity:0;
  -webkit-transition:opacity 0.8s ease;
  transition:opacity 0.8s ease;
}
.fade-layer.active{ opacity:1; }

/* ── TOP LEFT: WETTER ── */
#tile-weather{
  -webkit-flex:1;flex:1;
}
.wl{background:#dff0f8;height:100%;padding:10px 12px;overflow:hidden;}
.wl-loc{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:6px;}
.wl-main{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:10px;margin-bottom:6px;}
.wl-icon{font-size:2.2rem;}
.wl-temp{font-family:'Playfair Display',serif;font-size:2.6rem;color:var(--ink);line-height:1;}
.wl-desc{font-size:.78rem;color:var(--ink2);}
.wl-rain{font-size:.75rem;color:var(--blue);margin-top:2px;}
.wl-row{display:-webkit-flex;display:flex;gap:6px;margin-top:4px;}
.wl-sm{-webkit-flex:1;flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px;text-align:center;}
.wl-sm-d{font-size:.6rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;}
.wl-sm-i{font-size:1.2rem;}
.wl-sm-t{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--ink);}
.wl-sm-r{font-size:.62rem;color:var(--blue);}
/* Sailing */
.sl{background:#0d1b2a;height:100%;padding:10px 12px;overflow:hidden;}
.sl-title{font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:#7eb8d4;font-weight:600;margin-bottom:8px;}
.sl-grid{display:-webkit-flex;display:flex;gap:6px;}
.sl-day{-webkit-flex:1;flex:1;background:rgba(255,255,255,.06);border-radius:6px;padding:7px;}
.sl-day-name{font-family:'Playfair Display',serif;font-size:.85rem;color:#e8f4ff;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:4px;}
.sail-tbl{width:100%;border-collapse:collapse;table-layout:fixed;}
.st-lbl{font-size:.55rem;color:rgba(255,255,255,.4);padding:2px 2px;white-space:nowrap;width:26px;}
.st-hdr{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:#7eb8d4;text-align:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.1);}
.st-cell{text-align:center;font-size:.68rem;color:#e8f4ff;padding:2px 1px;font-family:'JetBrains Mono',monospace;}
.st-cell svg{margin:auto;display:block;}
.st-bft{border-radius:2px;font-weight:700;}

/* ── TOP RIGHT: FERIEN / GEBURTSTAGE ── */
#tile-info{
  -webkit-flex:1;flex:1;
}
.fl{background:#f0f8e8;height:100%;padding:8px 10px;overflow:hidden;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;}
/* Primary block: 63% */
.fl-main{background:rgba(255,255,255,.85);border-radius:7px;padding:7px 10px;height:63%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;}
.fl-divider{height:2%;background:rgba(26,74,42,.2);border-radius:2px;margin:2px 0;-webkit-flex-shrink:0;flex-shrink:0;}
/* Secondary block: remaining */
.fl-sec{background:rgba(255,255,255,.6);border-radius:6px;padding:5px 8px;-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;}
/* Row 1 */
.fl-name-row{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;gap:5px;white-space:nowrap;overflow:hidden;}
.fl-name{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fl-state{font-size:.58rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-flex-shrink:1;flex-shrink:1;}
/* Row 2: weeks left + details right, vertically centered */
.fl-count-row{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;gap:8px;}
.fl-weeks-block{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:5px;-webkit-flex-shrink:0;flex-shrink:0;}
.fl-in{font-size:.6rem;color:var(--ink3);}
.fl-weeks{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--green);line-height:1;white-space:nowrap;}
.fl-details{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-flex:1;flex:1;}
.fl-exact{font-size:.6rem;color:var(--ink2);line-height:1.3;white-space:nowrap;}
.fl-dates{font-size:.6rem;color:var(--ink3);line-height:1.3;white-space:nowrap;}
/* Secondary rows */
.fl-sec-name-row{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden;}
.fl-sec-name{font-family:'Playfair Display',serif;font-size:.78rem;color:var(--ink);font-weight:700;white-space:nowrap;}
.fl-sec-state{font-size:.5rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-flex-shrink:1;flex-shrink:1;}
.fl-sec-count-row{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;gap:6px;}
.fl-sec-weeks-block{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;-webkit-flex-shrink:0;flex-shrink:0;}
.fl-sec-in{font-size:.52rem;color:var(--ink3);}
.fl-sec-weeks{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--green);line-height:1;white-space:nowrap;}
.fl-sec-details{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-flex:1;flex:1;}
.fl-sec-exact{font-size:.52rem;color:var(--ink2);line-height:1.3;white-space:nowrap;}
.fl-sec-dates{font-size:.52rem;color:var(--ink3);line-height:1.3;white-space:nowrap;}
/* Birthdays */
.bl{background:#fff0f0;height:100%;padding:10px 12px;overflow:hidden;}
.bl-title{font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;}
.bl-none{font-size:.78rem;color:var(--ink3);font-style:italic;padding:8px 0;}
.bl-item{margin-bottom:8px;border-left:3px solid var(--accent);padding-left:8px;}
.bl-hdr{font-size:.6rem;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.bl-name-soon{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--accent);}
.bl-name-today{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--accent);}
.bl-sub{font-size:.7rem;color:var(--accent);margin-top:2px;}

/* ── MID: CALENDAR ── */
#tile-cal{
  width:100%;height:100%;
  background:#fff;
  border-radius:var(--radius);
  overflow:hidden;
  display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;
}
#cal-tabs{
  display:-webkit-flex;display:flex;
  background:#1a3a5c;
  -webkit-flex-shrink:0;flex-shrink:0;
  height:36px;
}
.cal-tab{
  -webkit-flex:1;flex:1;
  display:-webkit-flex;display:flex;
  -webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center;
  font-size:.78rem;font-weight:600;color:rgba(255,255,255,.45);
  cursor:pointer;letter-spacing:.04em;
  border-bottom:2px solid transparent;
  -webkit-transition:all .3s;transition:all .3s;
}
.cal-tab.active{color:#fff;border-bottom-color:var(--accent);}
#cal-body{
  -webkit-flex:1;flex:1;
  overflow:hidden;
  position:relative;
}
/* Calendar views */
.cal-view{
  position:absolute;top:0;left:0;right:0;bottom:0;
  opacity:0;pointer-events:none;
  -webkit-transition:opacity .5s;transition:opacity .5s;
  overflow:hidden;
}
.cal-view.active{opacity:1;pointer-events:auto;}

/* Day view (Heute / Morgen) */
.day-view{
  display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;
  height:100%;
}
.day-colheads{
  display:-webkit-flex;display:flex;
  border-bottom:1px solid var(--rule2);
  -webkit-flex-shrink:0;flex-shrink:0;
  background:#fff;
}
.day-spacer{width:36px;-webkit-flex-shrink:0;flex-shrink:0;border-right:1px solid var(--rule2);}
.day-cch{-webkit-flex:1;flex:1;padding:5px 4px;text-align:center;border-right:1px solid var(--rule);font-size:.6rem;}
.day-cch:last-child{border-right:none;}
.day-cch-lbl{font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);}
.day-cch-name{font-family:'Playfair Display',serif;font-size:.85rem;color:var(--ink);}
.day-cch-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 1px;vertical-align:middle;}
.day-scroll-wrap{-webkit-flex:1;flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;position:relative;}
.day-inner{display:-webkit-flex;display:flex;position:relative;}
.day-axis{width:36px;-webkit-flex-shrink:0;flex-shrink:0;border-right:1px solid var(--rule2);position:relative;}
.day-hm{position:absolute;left:0;right:0;border-top:1px solid var(--rule);}
.day-hl{position:absolute;right:4px;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--ink3);}
.day-half{position:absolute;left:55%;right:0;border-top:1px dashed var(--rule);opacity:.5;}
.day-red{position:absolute;left:0;right:0;height:2px;background:#e02020;z-index:20;pointer-events:none;}
.day-red:before{content:'';position:absolute;left:-1px;top:-3px;width:8px;height:8px;border-radius:50%;background:#e02020;}
.day-cols{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;position:relative;}
.day-col{-webkit-flex:1;flex:1;border-right:1px solid var(--rule);position:relative;}
.day-col:last-child{border-right:none;}
.day-cgl{position:absolute;left:0;right:0;border-top:1px solid var(--rule);pointer-events:none;}
.day-cghl{position:absolute;left:0;right:0;border-top:1px dashed var(--rule);opacity:.4;pointer-events:none;}
.ev{position:absolute;border-radius:3px;padding:2px 4px;overflow:hidden;border-left:3px solid;min-height:18px;}
.ev-time{font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--ink2);white-space:nowrap;}
.ev-title{font-size:.6rem;font-weight:600;color:var(--ink);line-height:1.2;margin-top:1px;}
.ev-detail{font-size:.52rem;color:var(--ink2);line-height:1.25;margin-top:1px;}
.ev-badge{font-size:.46rem;font-weight:700;text-transform:uppercase;margin-top:1px;opacity:.7;}

/* Weekend view */
.wknd-view{
  display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;
  height:100%;
  background:#fff;
}
.wknd-cols{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;overflow:hidden;}
.wknd-col{-webkit-flex:1;flex:1;border-right:1px solid var(--rule);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;}
.wknd-col:last-child{border-right:none;}
.wknd-col-head{padding:5px 8px;background:#fff9c4;color:#1a1612;font-family:'Playfair Display',serif;font-size:.85rem;-webkit-flex-shrink:0;flex-shrink:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;border-bottom:1px solid #e8e0a0;}
.wknd-col-head-sub{font-size:.68rem;color:#5a5020;margin-left:4px;}
.wknd-scroll{-webkit-flex:1;flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:6px;}
.wknd-ev{margin-bottom:5px;border-radius:4px;padding:5px 6px;border-left:3px solid;}
.wknd-ev-time{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--ink3);}
.wknd-ev-title{font-size:.68rem;font-weight:600;color:var(--ink);line-height:1.25;margin-top:1px;}
.wknd-none{font-size:.68rem;color:var(--ink3);font-style:italic;padding:8px 6px;}

/* ── BOTTOM: FAZ ── */
#tile-faz{
  background:#fff;
  height:100%;
  overflow:hidden;
  position:relative;
}
.faz-layer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  opacity:0;pointer-events:none;
  -webkit-transition:opacity .8s ease;
  transition:opacity .8s ease;
  padding:8px 12px;
  overflow:hidden;
}
.faz-layer.active{opacity:1;}
.faz-res{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px;}
.faz-items{display:-webkit-flex;display:flex;gap:10px;height:calc(100% - 22px);overflow:hidden;}
.faz-item{-webkit-flex:1;flex:1;overflow:hidden;}
.faz-title{font-family:'Playfair Display',serif;font-size:.95rem;line-height:1.3;color:var(--ink);margin-bottom:3px;}
.faz-desc{font-size:.7rem;color:var(--ink2);line-height:1.4;overflow:hidden;}
.faz-time{font-size:.58rem;color:var(--ink3);margin-top:3px;font-family:'JetBrains Mono',monospace;}
.faz-img{width:60px;height:45px;object-fit:cover;border-radius:3px;-webkit-flex-shrink:0;flex-shrink:0;float:right;margin-left:6px;}

/* ── SETTINGS ── */
#settings-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:#f5f1eb;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:80px;}
#settings-overlay.open{display:block;}
.s-title{font-family:'Playfair Display',serif;font-size:1.4rem;margin-bottom:14px;margin-top:50px;}
.s-sec{background:#fff;border-radius:11px;padding:14px;margin-bottom:12px;border:1px solid var(--rule2);}
.s-sec h3{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px;font-weight:600;}
.s-f{margin-bottom:10px;}
.s-lbl{font-size:.78rem;color:var(--ink2);margin-bottom:4px;display:block;}
.s-inp{width:100%;padding:9px 10px;border:1px solid var(--rule2);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--ink);background:#fff;outline:none;}
.s-row{display:-webkit-flex;display:flex;gap:7px;-webkit-align-items:center;align-items:center;}
.s-swatch{width:28px;height:28px;border-radius:5px;-webkit-flex-shrink:0;flex-shrink:0;cursor:pointer;border:2px solid transparent;}
.s-hint{font-size:.68rem;color:var(--ink3);margin-top:3px;line-height:1.45;}
.s-tr{display:-webkit-flex;display:flex;gap:6px;-webkit-align-items:center;align-items:center;margin-bottom:8px;}
.s-tlbl{font-size:.75rem;min-width:90px;color:var(--ink2);}
.s-save{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;display:block;-webkit-appearance:none;}
#s-close-btn{position:fixed;top:10px;right:12px;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:.75rem;cursor:pointer;z-index:600;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
#gear-btn{position:fixed;bottom:10px;right:10px;z-index:100;width:36px;height:36px;border-radius:50%;background:rgba(26,22,18,.25);border:1px solid rgba(26,22,18,.3);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:.9rem;cursor:pointer;}
</style>
</head>
<body>

<div id="grid">
  <!-- TOP ROW -->
  <div id="row-top">
    <!-- WEATHER TILE -->
    <div class="tile" id="tile-weather">
      <div class="fade-layer active" id="wl-weather"></div>
      <div class="fade-layer" id="wl-sail"></div>
    </div>
    <!-- INFO TILE -->
    <div class="tile" id="tile-info">
      <div class="fade-layer active" id="info-ferien"></div>
      <div class="fade-layer" id="info-bday"></div>
    </div>
  </div>

  <!-- MID: CALENDAR -->
  <div id="row-mid">
    <div id="tile-cal">
      <div id="cal-tabs">
        <div class="cal-tab active" id="tab-heute" onclick="switchCal('heute',true)">HEUTE</div>
        <div class="cal-tab" id="tab-morgen" onclick="switchCal('morgen',true)">MORGEN</div>
        <div class="cal-tab" id="tab-wknd" onclick="switchCal('wknd',true)">WOCHENENDE</div>
      </div>
      <div id="cal-body">
        <div class="cal-view active" id="view-heute">
          <div class="day-view" id="dv-heute"></div>
        </div>
        <div class="cal-view" id="view-morgen">
          <div class="day-view" id="dv-morgen"></div>
        </div>
        <div class="cal-view" id="view-wknd">
          <div class="wknd-view" id="dv-wknd"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SEPARATOR -->
  <div style="height:2px;background:#1a3a5c;border-radius:2px;margin:0 2px;flex-shrink:0"></div>
  <!-- BOTTOM: FAZ -->
  <div class="tile" id="row-bot">
    <div id="tile-faz"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-overlay">
  <div id="s-close-btn">✕ Schließen</div>
  <div class="s-title">⚙ Einstellungen</div>
  <div class="s-sec">
    <h3>📅 iCloud Kalender</h3>
    <div class="s-f"><label class="s-lbl">Familienkalender 1 URL</label>
      <div class="s-row"><input type="color" class="s-swatch" id="c-f1" value="#2171b5"><input class="s-inp" id="u-f1" type="url" placeholder="webcal://..."></div>
      <div class="s-hint">Kalender-App → (i) → Öffentlicher Kalender → Link kopieren</div></div>
    <div class="s-f"><label class="s-lbl">Familienkalender 2 URL</label>
      <div class="s-row"><input type="color" class="s-swatch" id="c-f2" value="#e6550d"><input class="s-inp" id="u-f2" type="url" placeholder="webcal://..."></div></div>
  </div>
  <div class="s-sec">
    <h3>🏫 Untis Stundenpläne</h3>
    <div class="s-f"><label class="s-lbl">Kind 1 Name</label><input class="s-inp" id="n-k1" type="text" placeholder="Emma"></div>
    <div class="s-f"><label class="s-lbl">Kind 1 Synonyme (kommagetrennt)</label><input class="s-inp" id="syn-k1" type="text" placeholder="mu12, Em, Emma M."></div>
    <div class="s-f"><label class="s-lbl">Kind 1 Untis URL</label>
      <div class="s-row"><input type="color" class="s-swatch" id="c-k1" value="#6a51a3"><input class="s-inp" id="u-k1" type="url" placeholder="https://mese.webuntis.com/..."></div>
      <div class="s-hint">Untis App → Einstellungen → Kalender-Abo → URL kopieren</div></div>
    <div class="s-f"><label class="s-lbl">Kind 2 Name</label><input class="s-inp" id="n-k2" type="text" placeholder="Luca"></div>
    <div class="s-f"><label class="s-lbl">Kind 2 Synonyme (kommagetrennt)</label><input class="s-inp" id="syn-k2" type="text" placeholder="mu14, Lu, Luca M."></div>
    <div class="s-f"><label class="s-lbl">Kind 2 Untis URL</label>

function fetchLocalIcs(filename,calId,color,cb){
  var xhr=new XMLHttpRequest();
  xhr.open('GET',filename+'?t='+Date.now(),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      var txt=xhr.responseText||'';
      if(xhr.status===200&&txt.indexOf('BEGIN:VCALENDAR')>-1){
        cb(parseIcal(txt,calId,color));
      } else {
        cb([]);
      }
    }
  };
  xhr.onerror=function(){cb([]);};
  xhr.timeout=15000;
  xhr.ontimeout=function(){cb([]);};
  xhr.send();
}

function fetchIcal(url,calId,color,cb){
  // url parameter kept for compatibility but ignored —
  // we read local .ics files generated by GitHub Action
  cb([]);
}
function parseIcal(txt,calId,color){
  var evs=[],blocks=txt.split('BEGIN:VEVENT').slice(1);
  for(var i=0;i<blocks.length;i++){
    try{
      var blk=blocks[i];
      var get=function(k){var m=blk.match(new RegExp(k+'[^:]*:([^\\r\\n]+)','i'));return m?unfold(m[1].trim()):'';};
      var sum=ui(get('SUMMARY')),desc=ui(get('DESCRIPTION')),loc=ui(get('LOCATION'));
      var ds=get('DTSTART'),de=get('DTEND');
      if(!sum||!ds)continue;
      var start=pdt(ds),end=de?pdt(de):new Date(start.getTime()+3600000);
      var allDay=/^\d{8}$/.test(ds.replace(/[TZ]/g,'').slice(0,8))&&ds.length===8;
      evs.push({summary:sum,desc:desc,location:loc,start:start,end:end,allDay:allDay,calId:calId,color:color});
    }catch(e){}
  }
  return evs;
}
function unfold(s){return s.replace(/\r?\n[ \t]/g,' ');}
function ui(s){return s.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');}
function pdt(s){s=s.replace('Z','').replace('T','');var y=+s.slice(0,4),mo=+s.slice(4,6)-1,d=+s.slice(6,8),h=+(s.slice(8,10)||0),m=+(s.slice(10,12)||0);return new Date(y,mo,d,h,m);}

function refreshCalendars(cb){
  var files=[
    {file:'cal1.ics', id:'fam1', color:cfg.cF1},
    {file:'cal2.ics', id:'fam2', color:cfg.cF2},
    {file:'calk1.ics',id:'k1',  color:cfg.cK1},
    {file:'calk2.ics',id:'k2',  color:cfg.cK2},
    {file:'calk3.ics',id:'k3',  color:cfg.cK3}
  ];
  var pending=files.length, results=[];
  for(var i=0;i<files.length;i++){
    (function(f){
      fetchLocalIcs(f.file,f.id,f.color,function(evts){
        for(var j=0;j<evts.length;j++)results.push(evts[j]);
        pending--;
        if(pending===0){
          results.sort(function(a,b){return a.start-b.start;});
          allEvents=results;
          if(cb)cb();
        }
      });
    })(files[i]);
  }
}

      +'</td>'
      +'</tr>'
      +'</table>'
      +'</div>';
  } else {
    gel('wl-weather').innerHTML='<div class="wl"><div class="wl-loc">Wetter wird geladen…</div></div>';
  }
  // Build sail layer
  if(sailWeather&&sailWeatherLoc){
    var today=new Date();
    var dSat=(6-today.getDay()+7)%7||7;
    var HOURS=[6,9,12,15,18],HLABELS=['06','09','12','15','18'];
    var SHOW_HOURS=12; // only show this hour label centered
    function dayTbl(offset,label){
      var td=new Date(today);td.setDate(today.getDate()+offset);
      var ds2=td.getFullYear()+'-'+p2(td.getMonth()+1)+'-'+p2(td.getDate());
      var times=sailWeather.hourly.time||[];
      var idxs=[];
      for(var hi=0;hi<HOURS.length;hi++){
        var tgt=ds2+'T'+p2(HOURS[hi])+':00',fi=-1;
        for(var ti=0;ti<times.length;ti++){if(times[ti]===tgt){fi=ti;break;}}
        idxs.push(fi);
      }
      // Header: only "12 Uhr" centered across all 5 columns
      var hdr='<th class="st-lbl"></th>'
        +'<th class="st-hdr" style="text-align:center" colspan="5">12 Uhr</th>';
      // dummy - actual columns still 5
      var hdrReal='<th class="st-lbl"></th>';
      for(var hi=0;hi<HOURS.length;hi++)hdrReal+='<th class="st-hdr" style="font-size:.45rem;opacity:.5">'+HOURS[hi]+'h</th>';
      var rW='<tr><td class="st-lbl">Bft</td>';
      var rG='<tr><td class="st-lbl">Böen</td>';
      var rR='<tr><td class="st-lbl">mm</td>';
      var rD='<tr><td class="st-lbl">↑</td>';
      for(var ci=0;ci<idxs.length;ci++){
        var idx=idxs[ci];
        var w=idx>=0?kn2bft(sailWeather.hourly.windspeed_10m[idx]):null;
        var g=idx>=0?kn2bft(sailWeather.hourly.windgusts_10m[idx]||0):null;
        var dir=idx>=0?sailWeather.hourly.winddirection_10m[idx]:null;
        var rain=idx>=0?Math.round((sailWeather.hourly.precipitation[idx]||0)*10)/10:null;
        var wc2=w!==null?bftColor(w):'transparent';
        var wtx=w!==null&&w>=7?'#fff':'#000';
        var gc2=g!==null?bftColor(g):'transparent';
        var gtx=g!==null&&g>=7?'#fff':'#000';
        var rc=rain!==null?(rain>2?'#e07070':rain>0.5?'#f0c040':'#7ec8a0'):'transparent';
        rW+='<td class="st-cell st-bft" style="background:'+wc2+';color:'+wtx+'">'+(w!==null?w:'')+'</td>';
        rG+='<td class="st-cell st-bft" style="background:'+gc2+';color:'+gtx+'">'+(g!==null?g:'')+'</td>';
        rR+='<td class="st-cell" style="color:'+rc+';font-weight:600">'+(rain!==null?rain:'')+'</td>';
        rD+='<td class="st-cell">'+(dir!==null?wdirArrow(dir,bftColor(w||0)):'')+'</td>';
      }
      rW+='</tr>';rG+='</tr>';rR+='</tr>';rD+='</tr>';
      return '<div class="sl-day"><div class="sl-day-name">'+label+'</div>'
        +'<table class="sail-tbl" style="height:calc(100% - 28px)">'
        +'<thead>'
        +'<tr><th class="st-lbl"></th><th class="st-hdr" colspan="5" style="text-align:center;font-size:.6rem;color:#7eb8d4;padding-bottom:3px">12 Uhr</th></tr>'
        +'</thead>'
        +'<tbody style="height:100%">'+rW+rG+rR+rD+'</tbody></table></div>';
    }
    var today2=new Date();
    var dSat2=(6-today2.getDay()+7)%7||7;
    var sat2=new Date(today2);sat2.setDate(today2.getDate()+dSat2);
    var sun2=new Date(sat2);sun2.setDate(sat2.getDate()+1);
    var ms2=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    var satLabel=sat2.getDate()+'. / '+sun2.getDate()+'. '+ms2[sat2.getMonth()];
    gel('wl-sail').innerHTML='<div class="sl"><div class="sl-title">⛵ '+sailWeatherLoc.name+' ('+satLabel+')</div><div class="sl-grid">'+dayTbl(dSat,'Sa')+dayTbl(dSat+1,'So')+'</div></div>';
  } else {
    gel('wl-sail').innerHTML='<div class="sl"><div class="sl-title">Segelwetter wird geladen…</div></div>';
  }
  startWeatherCycle();
}

function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function soD(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function eoD(d){var x=new Date(d);x.setHours(23,59,59,999);return x;}

function colId(calId){if(calId==='fam1'||calId==='fam2')return 'fam';if(calId==='k1')return 'k1';if(calId==='k2')return 'k2';if(calId==='k3')return 'k3';return null;}

function getKidTerms(kidNum){
  // returns array of name + synonyms for a kid (1,2,3)
  var name = kidNum===1?cfg.nK1:kidNum===2?cfg.nK2:cfg.nK3;
  var syns = kidNum===1?cfg.synK1:kidNum===2?cfg.synK2:cfg.synK3;
  var terms = [];
  if(name&&name.trim()) terms.push(name.trim().toLowerCase());
  if(syns){
    var parts = syns.split(',');
    for(var i=0;i<parts.length;i++){
      var s=parts[i].trim();
      if(s) terms.push(s.toLowerCase());
    }
  }
  return terms;
}

function buildChildCopies(evts){
  var kids=[
    {id:'k1',num:1,color:cfg.cK1},
    {id:'k2',num:2,color:cfg.cK2},
    {id:'k3',num:3,color:cfg.cK3}
  ];
  var copies=[];
  for(var i=0;i<evts.length;i++){
    var ev=evts[i];
    if(ev.calId!=='fam1'&&ev.calId!=='fam2')continue;
    var hay=(ev.summary+' '+(ev.desc||'')+' '+(ev.location||'')).toLowerCase();
    for(var j=0;j<kids.length;j++){
      var k=kids[j];
      var terms=getKidTerms(k.num);
      var matched=false;
      for(var ti=0;ti<terms.length;ti++){
        if(hay.indexOf(terms[ti])>-1){matched=true;break;}
      }
      if(matched){
        copies.push({summary:ev.summary,desc:ev.desc,location:ev.location,start:ev.start,end:ev.end,allDay:ev.allDay,calId:k.id,color:k.color,isCopy:true,origColor:ev.color});
      }
    }
  }
  return copies;
}

function layoutEvts(evts){
  var sorted=evts.slice().sort(function(a,b){return a.start-b.start;});
  var groups=[];
  for(var i=0;i<sorted.length;i++){
    var ev=sorted[i],placed=false;
    for(var gi=0;gi<groups.length;gi++){
      var g=groups[gi],gEnd=0;
      for(var ti=0;ti<g.length;ti++)for(var ei=0;ei<g[ti].length;ei++)if(g[ti][ei].end.getTime()>gEnd)gEnd=g[ti][ei].end.getTime();
      if(ev.start.getTime()<gEnd){
        var ft2=-1;
        for(var ti2=0;ti2<g.length;ti2++){if(g[ti2][g[ti2].length-1].end.getTime()<=ev.start.getTime()){ft2=ti2;break;}}
        if(ft2===-1)g.push([ev]);else g[ft2].push(ev);
        placed=true;break;
      }
    }
    if(!placed)groups.push([[ev]]);
  }
  var res=[];
  for(var gi=0;gi<groups.length;gi++){var g=groups[gi];for(var ti=0;ti<g.length;ti++)for(var ei=0;ei<g[ti].length;ei++)res.push({ev:g[ti][ei],sub:ti,tot:g.length});}
  return res;
}

function makeEvEl(ev,vd,sub,tot,minHour,maxHour){
  sub=sub||0;tot=tot||1;
  var el=document.createElement('div');el.className='ev';
  el.style.borderLeftColor=ev.color;
  el.style.background=h2r(ev.color,ev.isCopy?0.04:0.09);
  if(ev.isCopy)el.style.borderStyle='dashed';
  var sm,em;
  if(ev.allDay){sm=minHour*60;em=maxHour*60;}
  else{
    var ds=soD(vd),de=eoD(vd);
    var es=ev.start<ds?ds:ev.start,ee=ev.end>de?de:ev.end;
    sm=es.getHours()*60+es.getMinutes();
    em=ee.getHours()*60+ee.getMinutes();
    sm=Math.max(sm,minHour*60);em=Math.min(em,maxHour*60);
  }
  var offsetHours=minHour;
  var top=((sm/60)-offsetHours)*HH;
  var h=Math.max(18,((em-sm)/60)*HH-2);
  var pct=100/tot;
  el.style.top=top+'px';el.style.height=h+'px';
  el.style.left='calc('+sub*pct+'% + 2px)';el.style.right='auto';el.style.width='calc('+pct+'% - 5px)';
  var ts=ev.allDay?'Ganztag':ft(ev.start)+(ev.end?' – '+ft(ev.end):'');
  var det='';
  if(ev.desc){var lns=ev.desc.split(/\n/).slice(0,2);var ll=[];for(var i=0;i<lns.length;i++){var l=lns[i].trim();if(l)ll.push(esc(l));}if(ll.length)det='<div class="ev-detail">'+ll.join(' · ')+'</div>';}
  if(ev.location)det+='<div class="ev-detail">📍 '+esc(ev.location)+'</div>';
  var badge=ev.isCopy?'<div class="ev-badge" style="color:'+ev.origColor+'">Familienkalender</div>':'';
  el.innerHTML='<div class="ev-time">'+ts+'</div><div class="ev-title">'+esc(ev.summary)+'</div>'+badge+det;
  return el;
}

function buildDayView(container,date,minHour,maxHour,showRedLine){
  var totalHours=maxHour-minHour;
  var totalPx=totalHours*HH;
  // colheads
  var heads='<div class="day-colheads"><div class="day-spacer"></div>';
  heads+='<div class="day-cch"><div class="day-cch-lbl">Familie</div><div class="day-cch-name"><span class="day-cch-dot" style="background:'+cfg.cF1+'"></span><span class="day-cch-dot" style="background:'+cfg.cF2+'"></span>Fam</div></div>';
  heads+='<div class="day-cch"><div class="day-cch-lbl">'+esc(cfg.nK1)+'</div><div class="day-cch-name"><span class="day-cch-dot" style="background:'+cfg.cK1+'"></span>'+esc(cfg.nK1)+'</div></div>';
  heads+='<div class="day-cch"><div class="day-cch-lbl">'+esc(cfg.nK2)+'</div><div class="day-cch-name"><span class="day-cch-dot" style="background:'+cfg.cK2+'"></span>'+esc(cfg.nK2)+'</div></div>';
  heads+='<div class="day-cch"><div class="day-cch-lbl">'+esc(cfg.nK3)+'</div><div class="day-cch-name"><span class="day-cch-dot" style="background:'+cfg.cK3+'"></span>'+esc(cfg.nK3)+'</div></div>';
  heads+='</div>';
  container.innerHTML=heads+'<div class="day-scroll-wrap" id="dsw-'+container.id+'"><div class="day-inner"><div class="day-axis" id="dax-'+container.id+'" style="height:'+totalPx+'px"></div><div id="drl-'+container.id+'"></div><div class="day-cols" style="min-height:'+totalPx+'px"><div class="day-col" id="dc-fam-'+container.id+'"></div><div class="day-col" id="dc-k1-'+container.id+'"></div><div class="day-col" id="dc-k2-'+container.id+'"></div><div class="day-col" id="dc-k3-'+container.id+'"></div></div></div></div>';
  // build axis
  var ax=gel('dax-'+container.id);
  for(var h=minHour;h<=maxHour;h++){
    var m=document.createElement('div');m.className='day-hm';m.style.top=((h-minHour)*HH)+'px';
    m.innerHTML='<span class="day-hl" style="top:-9px">'+p2(h)+'</span><div class="day-half"></div>';
    ax.appendChild(m);
  }
  // build col grid lines
  var colIds=['dc-fam-','dc-k1-','dc-k2-','dc-k3-'];
  for(var ci=0;ci<colIds.length;ci++){
    var col=gel(colIds[ci]+container.id);
    col.style.minHeight=totalPx+'px';
    for(var h=minHour;h<=maxHour;h++){
      var l=document.createElement('div');l.className='day-cgl';l.style.top=((h-minHour)*HH)+'px';col.appendChild(l);
      var l2=document.createElement('div');l2.className='day-cghl';l2.style.top=((h-minHour)*HH+HH/2)+'px';col.appendChild(l2);
    }
  }
  // red line
  if(showRedLine){
    var rl=gel('drl-'+container.id);
    var now=new Date();
    var nowH=now.getHours()+now.getMinutes()/60;
    if(nowH>=minHour&&nowH<=maxHour){
      var redDiv=document.createElement('div');redDiv.className='day-red';
      redDiv.style.top=((nowH-minHour)*HH)+'px';
      rl.appendChild(redDiv);
    }
  }
  // events
  var dayEvts=[];
  for(var i=0;i<allEvents.length;i++){var e=allEvents[i];if(sameDay(e.start,date)||(!e.allDay&&e.start<=eoD(date)&&e.end>soD(date)))dayEvts.push(e);}
  var all=dayEvts.concat(buildChildCopies(dayEvts));
  var byCol={fam:[],k1:[],k2:[],k3:[]};
  for(var i=0;i<all.length;i++){var cid=colId(all[i].calId);if(cid&&byCol[cid])byCol[cid].push(all[i]);}
  var colKeys=['fam','k1','k2','k3'];
  for(var ki=0;ki<colKeys.length;ki++){
    var key=colKeys[ki];var laid=layoutEvts(byCol[key]);
    var colEl=gel('dc-'+key+'-'+container.id);
    for(var li=0;li<laid.length;li++){var evEl=makeEvEl(laid[li].ev,date,laid[li].sub,laid[li].tot,minHour,maxHour);if(evEl)colEl.appendChild(evEl);}
  }
  // scroll: for heute, position red line at 27% from top
  if(showRedLine){
    var sw=gel('dsw-'+container.id);
    var now2=new Date();
    var nowPx=(now2.getHours()+now2.getMinutes()/60-minHour)*HH;
    setTimeout(function(){sw.scrollTop=Math.max(0,nowPx-sw.clientHeight*0.27);},100);
  } else {
    // scroll to 7am
    var sw2=gel('dsw-'+container.id);
    setTimeout(function(){sw2.scrollTop=0;},100);
  }
}

function buildWkndView(container){
  var today=new Date();
  var dSat=(6-today.getDay()+7)%7||7;
  var sat=new Date(today);sat.setDate(today.getDate()+dSat);
  var sun=new Date(sat);sun.setDate(sat.getDate()+1);
  var html='<div class="wknd-cols">';
  function dayCol(d){
    var evts=[];
    for(var i=0;i<allEvents.length;i++){
      var ev=allEvents[i];
      if((ev.calId==='fam1'||ev.calId==='fam2')&&sameDay(ev.start,d))evts.push(ev);
    }
    evts.sort(function(a,b){return a.start-b.start;});
    var h='<div class="wknd-col"><div class="wknd-col-head">'+DAY[d.getDay()]+'<span class="wknd-col-head-sub">'+d.getDate()+'. '+MON[d.getMonth()]+'.</span></div><div class="wknd-scroll">';
    if(!evts.length)h+='<div class="wknd-none">Keine Termine</div>';
    else for(var i=0;i<evts.length;i++){
      var ev=evts[i],ts=ev.allDay?'Ganztag':ft(ev.start);
      h+='<div class="wknd-ev" style="border-left-color:'+ev.color+';background:'+h2r(ev.color,.08)+'"><div class="wknd-ev-time">'+ts+'</div><div class="wknd-ev-title">'+esc(ev.summary)+'</div></div>';
    }
    h+='</div></div>';
    return h;
  }
  html+=dayCol(sat)+dayCol(sun)+'</div>';
  container.innerHTML=html;
}

function updateRedLines(){
  var now=new Date();
  var nowPx=(now.getHours()+now.getMinutes()/60)*HH;
  // find red line in heute view and update
  var rl=gel('dv-heute') ? gel('dv-heute').querySelector('.day-red') : null;
  if(rl){
    var startH=Math.max(0,now.getHours()-1);
    rl.style.top=((now.getHours()+now.getMinutes()/60-startH)*HH)+'px';
    // auto-scroll heute to keep red line at 27%
    var sw=gel('dv-heute') ? gel('dv-heute').querySelector('.day-scroll-wrap') : null;
    if(sw&&currentCalView==='heute'){
      sw.scrollTop=Math.max(0,nowPx-startH*HH-sw.clientHeight*0.27);
    }
  }
}

function renderCalendars(){
  var today=new Date();
  var tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
  var startH=Math.max(0,today.getHours()-1);
  var dvH=gel('dv-heute');dvH.id='dv-heute';
  buildDayView(dvH,today,startH,22,true);
  var dvM=gel('dv-morgen');dvM.id='dv-morgen';
  buildDayView(dvM,tomorrow,7,21,false);
  var dvW=gel('dv-wknd');dvW.id='dv-wknd';
  buildWkndView(dvW);
  updateCalTabLabels();
}

// ── RENDER: FAZ ────────────────────────────────────
var fazFrozen=false;
var fazTimer=null;

function renderFAZ(){
  var faz=gel('tile-faz');
  faz.innerHTML='';
  for(var i=0;i<fazData.length;i++){
    var fd=fazData[i];
    if(!fd||!fd.articles.length)continue;
    var layer=document.createElement('div');
    layer.className='faz-layer'+(i===0?' active':'');
    var html='<div class="faz-res">FAZ — '+esc(fd.label)+'</div><div class="faz-items">';
    for(var j=0;j<Math.min(fd.articles.length,2);j++){
      var a=fd.articles[j];
      var t=a.pubDate?new Date(a.pubDate).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
      var img=a.img?'<img class="faz-img" src="'+a.img+'" onerror="this.parentNode.removeChild(this)">':'';
      html+='<div class="faz-item">'+img+'<div class="faz-title">'+esc(a.title)+'</div><div class="faz-desc">'+esc(a.desc.slice(0,120))+'</div>'+(t?'<div class="faz-time">'+t+'</div>':'')+'</div>';
    }
    html+='</div>';
    layer.innerHTML=html;
    faz.appendChild(layer);
  }
  startFAZCycle();
}

var calCycleTimer=null;
var calCycleIdx=0;
var calCycleViews=['heute','morgen','wknd'];

function startCalCycle(){
  if(calCycleTimer)clearInterval(calCycleTimer);
  if(calFrozen)return;
  calCycleTimer=setInterval(function(){
    if(calFrozen)return;
    calCycleIdx=(calCycleIdx+1)%calCycleViews.length;
    switchCal(calCycleViews[calCycleIdx],false);
  },4000);
}

function startFAZCycle(){
  if(fazTimer)clearInterval(fazTimer);
  fazIdx=0;
  if(fazFrozen)return;
  fazTimer=setInterval(function(){
    if(fazFrozen)return;
    var layers=gel('tile-faz').querySelectorAll('.faz-layer');
    if(!layers.length)return;
    for(var i=0;i<layers.length;i++)layers[i].className='faz-layer';
    fazIdx=(fazIdx+1)%layers.length;
    layers[fazIdx].className='faz-layer active';
  },3000);
}

// ── TILE FREEZE ON TAP ─────────────────────────────
function addTileTap(id,freezeVar,startFn){
  var el=gel(id);
  if(!el)return;
  el.addEventListener('touchend',function(e){
    // don't freeze if tapping scroll buttons or links
    if(e.target.tagName==='A'||e.target.tagName==='INPUT')return;
    window[freezeVar]=!window[freezeVar];
    if(!window[freezeVar])startFn();
    e.stopPropagation();
  },{passive:true});
}

// use globals for freeze flags
window.weatherFrozen=false;
window.infoFrozen=false;
window.fazFrozen=false;

function addTap(id,fn){
  var el=gel(id);if(!el)return;
  el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();fn();},{passive:false});
  el.addEventListener('click',function(e){e.preventDefault();fn();});
}

// ── SETTINGS ──────────────────────────────────────
function openSettings(){
  gel('settings-overlay').className='open';
  gel('u-f1').value=cfg.uF1;gel('u-f2').value=cfg.uF2;
  gel('c-f1').value=cfg.cF1;gel('c-f2').value=cfg.cF2;
  gel('n-k1').value=cfg.nK1;gel('n-k2').value=cfg.nK2;gel('n-k3').value=cfg.nK3;
  gel('syn-k1').value=cfg.synK1||'';gel('syn-k2').value=cfg.synK2||'';gel('syn-k3').value=cfg.synK3||'';
  gel('u-k1').value=cfg.uK1;gel('u-k2').value=cfg.uK2;gel('u-k3').value=cfg.uK3;
  gel('c-k1').value=cfg.cK1;gel('c-k2').value=cfg.cK2;gel('c-k3').value=cfg.cK3;
  gel('s-city').value=cfg.city;gel('s-sail').value=cfg.sail;
  gel('s-st1').value=cfg.st1;gel('s-st2').value=cfg.st2;
}
function closeSettings(){
  gel('settings-overlay').className='';
  saveCfg();
  init();
}
addTap('s-close-btn',closeSettings);
addTap('s-save-btn',closeSettings);
addTap('gear-btn',openSettings);

// tile taps
gel('tile-weather').addEventListener('touchend',function(e){
  if(e.target===gel('tile-weather')||e.target.closest('#tile-weather')){
    window.weatherFrozen=!window.weatherFrozen;
    if(!window.weatherFrozen)startWeatherCycle();
  }
},{passive:true});
gel('tile-info').addEventListener('touchend',function(e){
  window.infoFrozen=!window.infoFrozen;
  if(!window.infoFrozen)startInfoCycle();
},{passive:true});
gel('row-bot').addEventListener('touchend',function(e){
  if(e.target.tagName==='INPUT')return;
  window.fazFrozen=!window.fazFrozen;
  if(!window.fazFrozen)startFAZCycle();
},{passive:true});

// ── INIT ──────────────────────────────────────────
function init(){
  var pending=3;
  function done(){pending--;if(pending<=0)renderAll();}
  refreshCalendars(done);
  getWeather(cfg.city,function(loc,data){homeWeatherLoc=loc;homeWeather=data;done();});
  getWeather(cfg.sail,function(loc,data){sailWeatherLoc=loc;sailWeather=data;done();});
  fetchAllRSS(function(){renderFAZ();});
}

function renderAll(){
  renderWeatherTile();
  renderInfoTile();
  renderCalendars();
  startCalCycle();
}

loadCfg();
keepAwake();
init();

// ── AUTO-REFRESH ──────────────────────────────────
// Calendars: every 5 min
setInterval(function(){
  refreshCalendars(function(){renderInfoTile();renderCalendars();});
},5*60*1000);

// Weather: every 15 min
setInterval(function(){
  getWeather(cfg.city,function(loc,data){homeWeatherLoc=loc;homeWeather=data;renderWeatherTile();});
  getWeather(cfg.sail,function(loc,data){sailWeatherLoc=loc;sailWeather=data;renderWeatherTile();});
},15*60*1000);

// FAZ: every 10 min
setInterval(function(){
  fetchAllRSS(function(){renderFAZ();});
},10*60*1000);

// Red line: every minute
setInterval(function(){
  // Only re-render red line, not full calendar
  updateRedLines();
},60*1000);

// MIDNIGHT RESET: check every minute if day has changed
var lastDate = new Date().getDate();
setInterval(function(){
  var now = new Date();
  if(now.getDate() !== lastDate){
    lastDate = now.getDate();
    // Full reinit on new day
    refreshCalendars(function(){
      renderInfoTile();
      renderCalendars();
    });
    getWeather(cfg.city,function(loc,data){homeWeatherLoc=loc;homeWeather=data;renderWeatherTile();});
    getWeather(cfg.sail,function(loc,data){sailWeatherLoc=loc;sailWeather=data;renderWeatherTile();});
    fetchAllRSS(function(){renderFAZ();});
  }
},60*1000);

// ── DEBUG ─────────────────────────────────────────
function runDebug(){
  gel('debug-panel').style.display='block';
  var log=gel('debug-log');
  log.innerHTML='🔍 Starte Kalender-Test...<br><br>';
  var files=[
    {label:'Familienkalender 1', file:'cal1.ics',  color:cfg.cF1},
    {label:'Familienkalender 2', file:'cal2.ics',  color:cfg.cF2},
    {label:'Kind 1 ('+cfg.nK1+')', file:'calk1.ics', color:cfg.cK1},
    {label:'Kind 2 ('+cfg.nK2+')', file:'calk2.ics', color:cfg.cK2},
    {label:'Kind 3 ('+cfg.nK3+')', file:'calk3.ics', color:cfg.cK3}
  ];
  for(var i=0;i<files.length;i++){
    (function(f){
      log.innerHTML+='⏳ '+f.label+': teste lokale Datei...<br>';
      fetchLocalIcs(f.file,f.label,f.color,function(evts){
        if(evts.length>0){
          var today=new Date();today.setHours(0,0,0,0);
          var future=[];
          for(var k=0;k<evts.length;k++){
            var diff=Math.round((evts[k].start-today)/86400000);
            if(diff>=-1&&diff<=14)future.push(evts[k]);
          }
          log.innerHTML+='✅ '+f.label+': '+evts.length+' Termine, '+future.length+' in 14 Tagen<br>';
          for(var k=0;k<Math.min(future.length,3);k++){
            var ev=future[k];
            log.innerHTML+='&nbsp;&nbsp;→ '+esc(ev.summary)+' | '+ev.start.toLocaleDateString('de-DE')+'<br>';
          }
        } else {
          log.innerHTML+='❌ '+f.label+': Datei leer oder nicht gefunden (GitHub Action noch nicht gelaufen?)<br>';
        }
      });
    })(files[i]);
  }
}

var hasConfig=cfg.uF1||cfg.uF2||cfg.uK1||cfg.uK2||cfg.uK3;
if(!hasConfig)setTimeout(openSettings,1000);
