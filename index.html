<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Familie Display</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap');
:root{
  --bg:#f5f1eb;--paper:#fff;--ink:#1a1612;--ink2:#5a5550;--ink3:#9a9088;
  --rule:#e0dbd4;--rule2:#c8c2ba;--accent:#8b1a1a;--accent-light:#fff0f0;
  --blue:#1a3a5c;--green:#1a4a2a;
  --col-fam1:#2171b5;--col-fam2:#e6550d;
  --col-k1:#6a51a3;--col-k2:#31a354;--col-k3:#d94701;
  --hour-h:72px;--time-col:40px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);}
#hdr{position:fixed;top:0;left:0;right:0;height:46px;z-index:200;background:var(--ink);border-bottom:3px solid var(--accent);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:0 14px;}
#hdr-logo{font-family:'Playfair Display',serif;font-size:1.5rem;color:#fff;letter-spacing:.04em;}
#hdr-date{font-size:0.9rem;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;text-align:center;}
#hdr-clock{font-family:'JetBrains Mono',monospace;font-size:1.5rem;color:#fff;}
#feed-outer{position:fixed;top:49px;left:0;right:0;bottom:0;overflow:hidden;}
#feed-track{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;}
.sh{background:var(--ink);padding:9px 14px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;}
.sh-rule{-webkit-flex:1;flex:1;height:1px;background:rgba(255,255,255,.15);}
.sh-label{font-size:1.26rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600;white-space:nowrap;}
.nc{background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 14px;display:-webkit-flex;display:flex;gap:10px;-webkit-align-items:flex-start;align-items:flex-start;}
.nc-img{width:66px;height:50px;object-fit:cover;border-radius:3px;-webkit-flex-shrink:0;flex-shrink:0;}
.nc-body{-webkit-flex:1;flex:1;min-width:0;}
.nc-res{font-size:0.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:3px;}
.nc-title{font-family:'Playfair Display',serif;font-size:1.35rem;line-height:1.3;color:var(--ink);margin-bottom:4px;}
.nc-desc{font-size:1.02rem;color:var(--ink2);line-height:1.45;overflow:hidden;max-height:2.9em;}
.nc-time{font-size:0.84rem;color:var(--ink3);margin-top:4px;font-family:'JetBrains Mono',monospace;}
.wc{background:#dff0f8;border-bottom:1px solid var(--rule);padding:14px;}
.wc-loc{font-size:0.84rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:10px;}
.wc-row{display:-webkit-flex;display:flex;gap:10px;-webkit-align-items:stretch;align-items:stretch;}
.wc-today{-webkit-flex:2;flex:2;background:rgba(255,255,255,.8);border-radius:8px;padding:12px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:12px;}
.wc-today-icon{font-size:4.2rem;-webkit-flex-shrink:0;flex-shrink:0;}
.wc-today-temp{font-family:'Playfair Display',serif;font-size:3.6rem;color:var(--ink);line-height:1;}
.wc-today-desc{font-size:1.08rem;color:var(--ink2);margin-top:3px;}
.wc-today-rain{font-size:1.05rem;color:var(--blue);margin-top:3px;}
.wc-small-col{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:6px;}
.wc-small{background:rgba(255,255,255,.6);border-radius:7px;padding:8px;text-align:center;}
.wc-small-day{font-size:0.78rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.wc-small-icon{font-size:2.1rem;}
.wc-small-temp{font-family:'Playfair Display',serif;font-size:1.65rem;color:var(--ink);margin-top:2px;}
.wc-small-rain{font-size:0.9rem;color:var(--blue);margin-top:1px;}
.sc{background:#0d1b2a;border-bottom:1px solid var(--rule);padding:14px;}
.sc-title{font-size:0.84rem;letter-spacing:.1em;text-transform:uppercase;color:#7eb8d4;font-weight:600;margin-bottom:12px;}
.sc-two-days{display:-webkit-flex;display:flex;gap:10px;}
.sc-day-tbl{-webkit-flex:1;flex:1;background:rgba(255,255,255,.05);border-radius:7px;padding:8px;}
.sc-day-title{font-family:'Playfair Display',serif;font-size:1.32rem;color:#e8f4ff;margin-bottom:7px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:5px;}
.sail-tbl{width:100%;border-collapse:collapse;table-layout:fixed;}
.st-lbl-hdr{width:28px;}
.st-lbl{font-size:0.75rem;color:rgba(255,255,255,.4);padding:3px 2px;white-space:nowrap;width:28px;}
.st-hdr{font-family:'JetBrains Mono',monospace;font-size:0.87rem;color:#7eb8d4;text-align:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.12);}
.st-cell{text-align:center;font-size:0.975rem;color:#e8f4ff;padding:3px 1px;font-family:'JetBrains Mono',monospace;border-bottom:1px solid rgba(255,255,255,.04);}
.st-cell svg{margin:auto;display:block;}
.st-bft{border-radius:3px;font-weight:700;font-size:1.02rem;color:#000;}
.hc{background:#f0f8e8;padding:14px;border-bottom:1px solid var(--rule);}
.hc-title{font-size:0.84rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:10px;}
.hc-row{display:-webkit-flex;display:flex;gap:10px;-webkit-align-items:flex-start;align-items:flex-start;}
.hc-main{-webkit-flex:2;flex:2;background:rgba(255,255,255,.8);border-radius:8px;padding:12px;}
.hc-main-state{font-size:0.84rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;}
.hc-main-name{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--ink);margin:3px 0 6px;}
.hc-main-rund{font-size:0.9rem;color:var(--ink3);margin-bottom:1px;}
.hc-main-weeks{font-size:3.3rem;font-weight:700;color:var(--green);line-height:1;}
.hc-main-noch{font-size:0.9rem;color:var(--ink3);margin-top:1px;}
.hc-main-exact{font-size:0.975rem;color:var(--ink2);margin-top:4px;}
.hc-main-dates{font-size:0.9rem;color:var(--ink3);margin-top:3px;}
.hc-sec{-webkit-flex:1;flex:1;background:rgba(255,255,255,.6);border-radius:8px;padding:8px;}
.hc-sec-state{font-size:0.75rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;}
.hc-sec-name{font-size:1.05rem;color:var(--ink);margin:2px 0 4px;font-weight:500;}
.hc-sec-rund{font-size:0.78rem;color:var(--ink3);}
.hc-sec-weeks{font-size:1.95rem;font-weight:700;color:var(--green);line-height:1;}
.hc-sec-noch{font-size:0.75rem;color:var(--ink3);}
.hc-sec-exact{font-size:0.87rem;color:var(--ink2);margin-top:3px;}
.hc-sec-dates{font-size:0.825rem;color:var(--ink3);margin-top:2px;}
.bc{background:var(--accent-light);border-bottom:1px solid var(--rule);border-left:4px solid var(--accent);padding:12px 14px;}
.bc-hdr{font-size:0.81rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px;}
.bc-name-soon{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--accent);}
.bc-name-today{font-family:'Playfair Display',serif;font-size:3rem;color:var(--accent);}
.bc-sub{font-size:1.05rem;color:var(--accent);margin-top:3px;}
.wkc{background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 14px;}
.wkc-title{font-size:0.84rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:8px;}
.wkc-grid{display:-webkit-flex;display:flex;gap:8px;}
.wkc-day{-webkit-flex:1;flex:1;background:var(--bg);border-radius:6px;padding:8px;}
.wkc-day-name{font-family:'Playfair Display',serif;font-size:1.32rem;color:var(--ink);margin-bottom:5px;border-bottom:1px solid var(--rule);padding-bottom:4px;}
.wkc-ev{font-size:0.93rem;padding:3px 5px;border-radius:3px;margin-bottom:3px;border-left:2px solid;background:rgba(255,255,255,.8);line-height:1.3;}
.wkc-ev-time{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--ink3);}
.wkc-none{font-size:0.93rem;color:var(--ink3);font-style:italic;}
/* Calendar overlay */
#cal-overlay{position:fixed;inset:0;z-index:150;background:var(--paper);display:none;-webkit-flex-direction:column;flex-direction:column;}
#cal-overlay.visible{display:-webkit-flex;display:flex;}
#cal-top{background:var(--ink);color:#fff;height:44px;-webkit-flex-shrink:0;flex-shrink:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:0 12px;border-bottom:2px solid var(--accent);}
#cal-top-lbl{font-size:0.93rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);}
#cal-top-date{font-family:'Playfair Display',serif;font-size:1.425rem;-webkit-flex:1;flex:1;text-align:center;}
#cal-top-clock{font-family:'JetBrains Mono',monospace;font-size:1.32rem;color:rgba(255,255,255,.85);}
#cal-preview-bar{display:none;background:#111;color:#fff;text-align:center;padding:6px 12px;font-size:1.02rem;border-bottom:2px solid var(--accent);-webkit-flex-shrink:0;flex-shrink:0;}
#cal-colheads{display:-webkit-flex;display:flex;border-bottom:1px solid var(--rule2);-webkit-flex-shrink:0;flex-shrink:0;}
.cch-spacer{width:var(--time-col);-webkit-flex-shrink:0;flex-shrink:0;border-right:1px solid var(--rule2);}
.cch{-webkit-flex:1;flex:1;padding:7px 5px;text-align:center;border-right:1px solid var(--rule);position:relative;}
.cch:last-child{border-right:none;}
.cch-lbl{font-size:0.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:1px;}
.cch-name{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--ink);}
.cch-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 2px;vertical-align:middle;}
.wk-btn{position:absolute;right:3px;top:50%;margin-top:-10px;background:var(--ink);color:#fff;border:none;border-radius:4px;font-size:0.72rem;padding:2px 5px;cursor:pointer;white-space:nowrap;}
#cal-body{-webkit-flex:1;flex:1;overflow:hidden;position:relative;}
#cal-scroll{overflow-y:scroll;height:100%;-webkit-overflow-scrolling:touch;}
#cal-inner{display:-webkit-flex;display:flex;position:relative;min-height:1728px;}
#time-axis{width:var(--time-col);-webkit-flex-shrink:0;flex-shrink:0;position:relative;border-right:1px solid var(--rule2);}
.hm{position:absolute;left:0;right:0;border-top:1px solid var(--rule);height:var(--hour-h);}
.hm:first-child{border-top:none;}
.hl{position:absolute;right:6px;top:-8px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--ink3);}
.half{position:absolute;left:60%;right:0;top:36px;border-top:1px solid var(--rule);opacity:.5;}
#red-line{position:absolute;left:0;right:0;height:2px;background:#e02020;z-index:30;pointer-events:none;}
#red-line:before{content:'';position:absolute;left:-1px;top:-4px;width:9px;height:9px;border-radius:50%;background:#e02020;}
#cal-cols{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;position:relative;}
.cal-col{-webkit-flex:1;flex:1;border-right:1px solid var(--rule);position:relative;min-height:1728px;}
.cal-col:last-child{border-right:none;}
.cgl{position:absolute;left:0;right:0;border-top:1px solid var(--rule);pointer-events:none;}
.cghl{position:absolute;left:0;right:0;border-top:1px dashed var(--rule);opacity:.5;pointer-events:none;}
.ev{position:absolute;border-radius:4px;padding:3px 5px;overflow:hidden;border-left:3px solid;min-height:20px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.ev-time{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--ink2);white-space:nowrap;}
.ev-title{font-size:0.93rem;font-weight:600;color:var(--ink);line-height:1.25;margin-top:1px;}
.ev-detail{font-size:0.81rem;color:var(--ink2);line-height:1.3;margin-top:2px;}
.ev-fam-badge{font-size:0.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;opacity:.75;}
#scrl-btns{position:absolute;right:8px;top:50%;margin-top:-60px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:5px;z-index:50;}
.scrl-btn{width:34px;height:34px;background:var(--ink);color:#fff;border-radius:50%;font-size:1.5rem;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;opacity:.7;cursor:pointer;-webkit-user-select:none;user-select:none;}
/* Week overlay */
#week-overlay{position:fixed;inset:0;z-index:160;background:var(--paper);display:none;-webkit-flex-direction:column;flex-direction:column;}
#week-overlay.visible{display:-webkit-flex;display:flex;}
#week-top{background:var(--ink);color:#fff;height:44px;-webkit-flex-shrink:0;flex-shrink:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:0 12px;}
#week-top-title{font-family:'Playfair Display',serif;font-size:1.425rem;-webkit-flex:1;flex:1;text-align:center;}
.wk-close{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 10px;font-size:1.02rem;cursor:pointer;}
#week-colheads{display:-webkit-flex;display:flex;border-bottom:1px solid var(--rule2);-webkit-flex-shrink:0;flex-shrink:0;}
.wch{-webkit-flex:1;flex:1;padding:7px 4px;text-align:center;border-right:1px solid var(--rule);font-size:0.87rem;color:var(--ink2);}
.wch:last-child{border-right:none;}
.wch.tod{color:var(--accent);font-weight:600;}
.wch-d{font-size:0.78rem;text-transform:uppercase;letter-spacing:.06em;}
.wch-n{font-family:'Playfair Display',serif;font-size:1.5rem;margin-top:1px;}
#week-body{-webkit-flex:1;flex:1;overflow-y:auto;display:-webkit-flex;display:flex;-webkit-overflow-scrolling:touch;}
.wk-col{-webkit-flex:1;flex:1;border-right:1px solid var(--rule);padding:5px 3px;}
.wk-col:last-child{border-right:none;}
.wk-ev{margin-bottom:4px;border-radius:4px;padding:4px 5px;border-left:2px solid;}
.wk-ev-time{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--ink3);}
.wk-ev-title{font-size:0.9rem;font-weight:600;color:var(--ink);line-height:1.25;margin-top:1px;}
.wk-ev-detail{font-size:0.78rem;color:var(--ink2);margin-top:1px;line-height:1.3;}
/* Settings */
#settings-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:var(--bg);overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:80px;}
#settings-overlay.open{display:block;}
.s-title{font-family:'Playfair Display',serif;font-size:1.875rem;margin-bottom:14px;}
.s-sec{background:#fff;border-radius:11px;padding:14px;margin-bottom:12px;border:1px solid var(--rule2);}
.s-sec h3{font-size:0.87rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px;font-weight:600;}
.s-f{margin-bottom:9px;}
.s-lbl{font-size:0.975rem;color:var(--ink2);margin-bottom:4px;display:block;}
.s-inp{width:100%;padding:8px 10px;border:1px solid var(--rule2);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:1.17rem;color:var(--ink);background:#fff;outline:none;}
.s-row{display:-webkit-flex;display:flex;gap:7px;-webkit-align-items:center;align-items:center;}
.s-swatch{width:26px;height:26px;border-radius:5px;-webkit-flex-shrink:0;flex-shrink:0;cursor:pointer;border:2px solid transparent;}
.s-hint{font-size:0.9rem;color:var(--ink3);margin-top:3px;line-height:1.45;}
.s-tr{display:-webkit-flex;display:flex;gap:6px;-webkit-align-items:center;align-items:center;margin-bottom:7px;}
.s-tlbl{font-size:1.02rem;min-width:85px;color:var(--ink2);}
.s-save{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:1.32rem;font-weight:600;cursor:pointer;margin-top:5px;display:block;-webkit-appearance:none;}
#s-close-btn{position:fixed;top:10px;right:12px;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:7px 13px;font-size:1.02rem;cursor:pointer;z-index:600;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
#gear-btn{position:fixed;bottom:12px;left:12px;z-index:100;width:38px;height:38px;border-radius:50%;background:rgba(26,22,18,.2);border:1px solid rgba(26,22,18,.25);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:1.5rem;cursor:pointer;}
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-logo">Familie</div>
  <div id="hdr-date"></div>
  <div id="hdr-clock"></div>
</div>

<div id="feed-outer" id="feed-outer">
  <div id="feed-track"><div style="padding:20px;text-align:center;color:var(--ink3);font-size:.8rem">Wird geladen…</div></div>
</div>

<div id="cal-overlay">
  <div id="cal-top">
    <div id="cal-top-lbl">Kalender</div>
    <div id="cal-top-date"></div>
    <div id="cal-top-clock"></div>
  </div>
  <div id="cal-preview-bar">Vorschau für <strong id="preview-lbl"></strong></div>
  <div id="cal-colheads">
    <div class="cch-spacer"></div>
    <div class="cch">
      <div class="cch-lbl">Familie</div>
      <div class="cch-name"><span class="cch-dot" id="dot-f1"></span><span class="cch-dot" id="dot-f2"></span>Familie</div>
    </div>
    <div class="cch"><div class="cch-lbl">Kind 1</div><div class="cch-name" id="head-k1"></div></div>
    <div class="cch"><div class="cch-lbl">Kind 2</div><div class="cch-name" id="head-k2"></div></div>
    <div class="cch" style="position:relative">
      <div class="cch-lbl">Kind 3</div>
      <div class="cch-name" id="head-k3"></div>
      <div class="wk-btn" id="wk-btn-el">7 Tage›</div>
    </div>
  </div>
  <div id="cal-body">
    <div id="scrl-btns">
      <div class="scrl-btn" id="scrl-up">▲</div>
      <div class="scrl-btn" id="scrl-dn">▼</div>
      <div class="scrl-btn" id="scrl-nx" style="font-size:.65rem">+1</div>
    </div>
    <div id="cal-scroll">
      <div id="cal-inner">
        <div id="time-axis"></div>
        <div id="red-line"></div>
        <div id="cal-cols">
          <div class="cal-col" id="col-fam"></div>
          <div class="cal-col" id="col-k1"></div>
          <div class="cal-col" id="col-k2"></div>
          <div class="cal-col" id="col-k3"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="week-overlay">
  <div id="week-top">
    <div id="week-top-title">Nächste 7 Tage</div>
    <div class="wk-close" id="wk-close-btn">✕ Zurück</div>
  </div>
  <div id="week-colheads"></div>
  <div id="week-body"></div>
</div>

<div id="settings-overlay">
  <div id="s-close-btn">✕ Schließen</div>
  <div class="s-title" style="margin-top:44px">⚙ Einstellungen</div>
  <div class="s-sec">
    <h3>📅 iCloud Kalender</h3>
    <div class="s-f"><label class="s-lbl">Familienkalender 1 URL</label>
      <div class="s-row"><input type="color" class="s-swatch" id="c-f1" value="#2171b5"><input class="s-inp" id="u-f1" type="url" placeholder="webcal://..."></div></div>
    <div class="s-f"><label class="s-lbl">Familienkalender 2 URL</label>
      <div class="s-row"><input type="color" class="s-swatch" id="c-f2" value="#e6550d"><input class="s-inp" id="u-f2" type="url" placeholder="webcal://..."></div></div>
  </div>
  <div class="s-sec">
    <h3>🏫 Untis Stundenpläne</h3>

// ── CLOCK ────────────────────────────────────────────────────────
var DAY = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var DS  = ['So','Mo','Di','Mi','Do','Fr','Sa'];
function p2(n){ return n < 10 ? '0'+n : ''+n; }
function ft(d){ return p2(d.getHours())+':'+p2(d.getMinutes()); }
function fds(d){ return DS[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function h2rgba(h,a){ var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+a+')'; }

function updateClock() {
  var now = new Date();
  gel('hdr-clock').textContent = ft(now);
  gel('hdr-date').textContent = DAY[now.getDay()]+', '+now.getDate()+'. '+MON[now.getMonth()];
  gel('cal-top-clock').textContent = ft(now);
}

// ── MODE ─────────────────────────────────────────────────────────
function t2m(s){ var p=s.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
function isCalTime(){ var n=new Date(),c=n.getHours()*60+n.getMinutes(); return (c>=t2m(cfg.tMs)&&c<t2m(cfg.tMe))||(c>=t2m(cfg.tAs)&&c<t2m(cfg.tAe)); }
function isAfternoon(){ var n=new Date(),c=n.getHours()*60+n.getMinutes(); return c>=t2m(cfg.tAs)&&c<t2m(cfg.tAe); }
function checkAutoMode(){ if(gel('settings-overlay').className.indexOf('open')>-1)return; if(gel('week-overlay').className.indexOf('visible')>-1)return; if(tapTimer)return; if(isCalTime())showCalendar(); else hideCalendar(); }

function showCalendar() {
  var now = new Date();
  calDate = new Date(now);
  calDate.setDate(calDate.getDate() + calOffDays);
  if(isAfternoon() && calOffDays===0) calDate.setDate(calDate.getDate()+1);
  var isToday = sameDay(calDate,now);
  var pb = gel('cal-preview-bar');
  if(!isToday){ pb.style.display='block'; gel('preview-lbl').textContent=DAY[calDate.getDay()]+', den '+calDate.getDate()+'. '+MON[calDate.getMonth()]+' '+calDate.getFullYear(); }

  gel('cal-top-date').textContent=fds(calDate);
  renderCalDay(calDate);
  gel('cal-overlay').className='visible';
  var sc=gel('cal-scroll');
  var nowPx=(now.getHours()+now.getMinutes()/60)*HH;
  setTimeout(function(){ sc.scrollTop=Math.max(0,nowPx-sc.clientHeight*0.2); },50);
  updateRedLine();
}
function hideCalendar(){ gel('cal-overlay').className=''; calOffDays=0; }
function onScreenTap(){
  if(gel('settings-overlay').className.indexOf('open')>-1)return;

// ── CALENDAR BUILD ───────────────────────────────────────────────
function buildTimeAxis() {
  var ax=gel('time-axis'); ax.style.height=(HH*24)+'px';
  for(var h=0;h<24;h++){
    var m=document.createElement('div'); m.className='hm'; m.style.top=(h*HH)+'px';

    ax.appendChild(m);
  }
  var cols=['col-fam','col-k1','col-k2','col-k3'];

      var l2=document.createElement('div'); l2.className='cghl'; l2.style.top=(h2*HH+HH/2)+'px'; col.appendChild(l2);
    }
  }
}
function updateRedLine(){ var now=new Date(); gel('red-line').style.top=((now.getHours()+now.getMinutes()/60)*HH)+'px'; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function soD(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function eoD(d){ var x=new Date(d); x.setHours(23,59,59,999); return x; }

function colId(calId){ if(calId==='fam1'||calId==='fam2')return 'col-fam'; if(calId==='k1')return 'col-k1'; if(calId==='k2')return 'col-k2'; if(calId==='k3')return 'col-k3'; return null; }

function buildChildCopies(evts) {
  var kids=[{id:'k1',name:cfg.nK1,color:cfg.cK1},{id:'k2',name:cfg.nK2,color:cfg.cK2},{id:'k3',name:cfg.nK3,color:cfg.cK3}];
  var copies=[];
  for(var i=0;i<evts.length;i++){
    var ev=evts[i];
    if(ev.calId!=='fam1'&&ev.calId!=='fam2')continue;
    var hay=(ev.summary+' '+ev.desc+' '+ev.location).toLowerCase();
    for(var j=0;j<kids.length;j++){
      var k=kids[j];
      if(k.name&&hay.indexOf(k.name.toLowerCase())>-1){
        copies.push({summary:ev.summary,desc:ev.desc,location:ev.location,start:ev.start,end:ev.end,allDay:ev.allDay,calId:k.id,color:k.color,isCopy:true,origColor:ev.color});
      }
    }
  }
  return copies;
}

function layoutCol(evts) {
  var sorted=evts.slice().sort(function(a,b){return a.start-b.start;});
  var groups=[];
  for(var i=0;i<sorted.length;i++){
    var ev=sorted[i]; var placed=false;
    for(var gi=0;gi<groups.length;gi++){
      var g=groups[gi];
      var gEnd=0;
      for(var ti=0;ti<g.length;ti++) for(var ei=0;ei<g[ti].length;ei++) if(g[ti][ei].end.getTime()>gEnd) gEnd=g[ti][ei].end.getTime();
      if(ev.start.getTime()<gEnd){
        var freeTrack=-1;
        for(var ti2=0;ti2<g.length;ti2++){ if(g[ti2][g[ti2].length-1].end.getTime()<=ev.start.getTime()){freeTrack=ti2;break;} }
        if(freeTrack===-1) g.push([ev]); else g[freeTrack].push(ev);
        placed=true; break;
      }
    }
    if(!placed) groups.push([[ev]]);
  }
  var res=[];
  for(var gi2=0;gi2<groups.length;gi2++){var g2=groups[gi2];for(var ti3=0;ti3<g2.length;ti3++){for(var ei2=0;ei2<g2[ti3].length;ei2++){res.push({ev:g2[ti3][ei2],sub:ti3,tot:g2.length});}}}
  return res;
}

function renderCalDay(date) {
  var ids=['col-fam','col-k1','col-k2','col-k3'];
  for(var i=0;i<ids.length;i++){ var c=gel(ids[i]); var evEls=c.querySelectorAll('.ev'); for(var j=0;j<evEls.length;j++) c.removeChild(evEls[j]); }
  var dayEvts=[];
  for(var i=0;i<allEvents.length;i++){ var e=allEvents[i]; if(sameDay(e.start,date)||(!e.allDay&&e.start<=eoD(date)&&e.end>soD(date))) dayEvts.push(e); }
  var all=dayEvts.concat(buildChildCopies(dayEvts));
  var byCol={'col-fam':[],'col-k1':[],'col-k2':[],'col-k3':[]};
  for(var i=0;i<all.length;i++){ var cid=colId(all[i].calId); if(cid&&byCol[cid]) byCol[cid].push(all[i]); }
  var colKeys=Object.keys(byCol);
  for(var ki=0;ki<colKeys.length;ki++){
    var key=colKeys[ki]; var laid=layoutCol(byCol[key]);
    for(var li=0;li<laid.length;li++){ var colEl=gel(key); if(colEl) colEl.appendChild(makeEvEl(laid[li].ev,date,laid[li].sub,laid[li].tot)); }
  }
}

function makeEvEl(ev,vd,sub,tot) {
  sub=sub||0; tot=tot||1;
  var el=document.createElement('div'); el.className='ev';
  el.style.borderLeftColor=ev.color;
  el.style.background=h2rgba(ev.color,ev.isCopy?0.04:0.08);
  if(ev.isCopy) el.style.borderStyle='dashed';
  var sm,em;
  if(ev.allDay){sm=0;em=1440;}
  else{
    var ds=soD(vd),de=eoD(vd);
    var es=ev.start<ds?ds:ev.start, ee=ev.end>de?de:ev.end;
    sm=es.getHours()*60+es.getMinutes(); em=ee.getHours()*60+ee.getMinutes();
  }
  var top=(sm/60)*HH, h=Math.max(20,((em-sm)/60)*HH-2);
  var pct=100/tot;
  el.style.top=top+'px'; el.style.height=h+'px';
  el.style.left='calc('+sub*pct+'% + 3px)'; el.style.right='auto'; el.style.width='calc('+pct+'% - 8px)';
  var ts=ev.allDay?'Ganztag':ft(ev.start)+(ev.end?' – '+ft(ev.end):'');
  var det='';
  if(ev.desc){var lines=ev.desc.split(/\n/).slice(0,3);var ll=[];for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(l)ll.push(esc(l));}if(ll.length)det+='<div class="ev-detail">'+ll.join(' · ')+'</div>';}
  if(ev.location)det+='<div class="ev-detail">📍 '+esc(ev.location)+'</div>';
  var badge=ev.isCopy?'<div class="ev-fam-badge" style="color:'+ev.origColor+'">Familienkalender</div>':'';
  el.innerHTML='<div class="ev-time">'+ts+'</div><div class="ev-title">'+esc(ev.summary)+'</div>'+badge+det;
  return el;
}

        html+='<div class="wk-ev" style="border-left-color:'+ev.color+';background:'+h2rgba(ev.color,.07)+'"><div class="wk-ev-time">'+ts+'</div><div class="wk-ev-title">'+esc(ev.summary)+'</div>'+det+'</div>';
      }
      col.innerHTML=html;
    }
    body.appendChild(col);
  }
  gel('week-overlay').className='visible';
}

// ── iCAL ─────────────────────────────────────────────────────────
function fetchIcal(url,calId,color,cb){
  if(!url){cb([]);return;}
  var u=url.replace(/^webcal:\/\//i,'https://');
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://corsproxy.io/?'+encodeURIComponent(u),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200) cb(parseIcal(xhr.responseText,calId,color));
      else cb([]);
    }
  };
  xhr.onerror=function(){cb([]);};
  xhr.send();
}
function parseIcal(txt,calId,color){
  var evs=[], blocks=txt.split('BEGIN:VEVENT').slice(1);
  for(var i=0;i<blocks.length;i++){
    try{
      var blk=blocks[i];
      var get=function(k){var m=blk.match(new RegExp(k+'[^:]*:([^\\r\\n]+)','i'));return m?unfold(m[1].trim()):'';};
      var sum=ui(get('SUMMARY')),desc=ui(get('DESCRIPTION')),loc=ui(get('LOCATION'));
      var ds=get('DTSTART'),de=get('DTEND');
      if(!sum||!ds)continue;
      var start=pdt(ds),end=de?pdt(de):new Date(start.getTime()+3600000);
      var allDay=/^\d{8}$/.test(ds.replace(/[TZ]/g,'').slice(0,8))&&ds.length===8;
      evs.push({summary:sum,desc:desc,location:loc,start:start,end:end,allDay:allDay,calId:calId,color:color});
    }catch(e){}
  }
  return evs;
}
function unfold(s){return s.replace(/\r?\n[ \t]/g,' ');}
function ui(s){return s.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');}
function pdt(s){s=s.replace('Z','').replace('T','');var y=+s.slice(0,4),mo=+s.slice(4,6)-1,d=+s.slice(6,8),h=+(s.slice(8,10)||0),m=+(s.slice(10,12)||0);return new Date(y,mo,d,h,m);}

function refreshCalendars(){
  var tasks=[
    {url:cfg.uF1,id:'fam1',color:cfg.cF1},{url:cfg.uF2,id:'fam2',color:cfg.cF2},
    {url:cfg.uK1,id:'k1',color:cfg.cK1},{url:cfg.uK2,id:'k2',color:cfg.cK2},{url:cfg.uK3,id:'k3',color:cfg.cK3}
  ];
  var pending=0, results=[];
  for(var i=0;i<tasks.length;i++){
    if(tasks[i].url){ pending++; }
  }
  if(pending===0){allEvents=[];if(gel('cal-overlay').className.indexOf('visible')>-1)renderCalDay(calDate);return;}
  for(var i=0;i<tasks.length;i++){
    (function(t){
      if(!t.url)return;
      fetchIcal(t.url,t.id,t.color,function(evts){
        for(var j=0;j<evts.length;j++) results.push(evts[j]);
        pending--;
        if(pending===0){
          results.sort(function(a,b){return a.start-b.start;});
          allEvents=results;
          if(gel('cal-overlay').className.indexOf('visible')>-1) renderCalDay(calDate);
        }
      });
    })(tasks[i]);
  }
}

function nextFerien(code){
  var today=new Date();today.setHours(0,0,0,0);
  var list=FERIEN[code]||FERIEN.SH;
  for(var i=0;i<list.length;i++){
    var f=list[i],s=new Date(f.start),e=new Date(f.end);e.setHours(23,59,59);
    if(e>=today)return{name:f.name,start:s,end:e,days:Math.max(0,Math.ceil((s-today)/86400000)),inF:today>=s};
  }
  return null;
}
function roundWeeks(days){
  if(days===0)return{rund:'heute',weeks:'',noch:'',exact:''};
  if(days<=6)return{rund:'rund',weeks:days+' Tag'+(days===1?'':'e'),noch:'noch',exact:''};
  var w=Math.ceil(days/7);
  return{rund:'rund',weeks:w+' Woche'+(w===1?'':'n'),noch:'noch',exact:days+' Tage genau'};
}

function geocode(city,cb){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=de&format=json',true);
  xhr.onreadystatechange=function(){if(xhr.readyState===4){try{var d=JSON.parse(xhr.responseText);if(d.results&&d.results.length)cb(d.results[0]);else cb(null);}catch(e){cb(null);}}};
  xhr.onerror=function(){cb(null);};
  xhr.send();
}
function getWeather(city,cb){
  geocode(city,function(loc){
    if(!loc){cb(null,null);return;}
    var url='https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude
      +'&current=temperature_2m,weathercode,precipitation_probability'
      +'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max,winddirection_10m_dominant,weathercode'
      +'&hourly=temperature_2m,precipitation,windspeed_10m,windgusts_10m,winddirection_10m,weathercode'
      +'&wind_speed_unit=kn&timezone=Europe%2FBerlin&forecast_days=8';
    var xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.onreadystatechange=function(){if(xhr.readyState===4){try{cb(loc,JSON.parse(xhr.responseText));}catch(e){cb(null,null);}}};
    xhr.onerror=function(){cb(null,null);};
    xhr.send();
  });
}
function wmoIcon(c){if(c===0)return'☀️';if(c<=2)return'⛅';if(c<=3)return'☁️';if(c<=49)return'🌫️';if(c<=59)return'🌦️';if(c<=69)return'🌧️';if(c<=79)return'🌨️';if(c<=82)return'🌧️';return'⛈️';}
function wmoDesc(c){if(c===0)return'Sonnig';if(c<=2)return'Leicht bewölkt';if(c<=3)return'Bedeckt';if(c<=49)return'Neblig';if(c<=59)return'Nieselregen';if(c<=69)return'Regen';if(c<=79)return'Schnee';return'Gewitter';}
function bftColor(b){var colors=['#c8c8c8','#9bdb64','#6dc73c','#44c232','#f5f500','#f0c800','#f0a000','#f07800','#f04800','#f00000','#c80000','#a000c8','#6400c8'];return colors[Math.min(b,12)];}
function kn2bft(k){if(k<1)return 0;if(k<4)return 1;if(k<7)return 2;if(k<11)return 3;if(k<17)return 4;if(k<22)return 5;if(k<28)return 6;if(k<34)return 7;if(k<41)return 8;if(k<48)return 9;if(k<56)return 10;if(k<64)return 11;return 12;}
function bftLbl(b){return['Windstill','Leiser Zug','Leichte Brise','Schwache Brise','Mäßige Brise','Frische Brise','Starker Wind','Steifer Wind','Stürmischer Wind','Sturm','Schwerer Sturm','Orkanartig','Orkan'][Math.min(b,12)];}
function wdirArrow(deg,col){return'<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><g transform="rotate('+deg+',10,10)"><line x1="10" y1="16" x2="10" y2="4" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/><polyline points="5,9 10,3 15,9" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g></svg>';}

function fetchRSS(feed,cb){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://corsproxy.io/?'+encodeURIComponent(feed.url),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{
          var parser=new DOMParser();
          var xml=parser.parseFromString(xhr.responseText,'text/xml');
          var items=xml.querySelectorAll('item');
          var arts=[];
          for(var i=0;i<Math.min(items.length,4);i++){
            var it=items[i];
            var title=it.querySelector('title')?it.querySelector('title').textContent:'';
            var desc=(it.querySelector('description')?it.querySelector('description').textContent:'').replace(/<[^>]+>/g,'').trim();
            var img=it.querySelector('enclosure')?it.querySelector('enclosure').getAttribute('url'):'';
            var pub=it.querySelector('pubDate')?it.querySelector('pubDate').textContent:'';
            arts.push({title:title,desc:desc,img:img,pubDate:pub,ressort:feed.label});
          }
          cb(arts);
        }catch(e){cb([]);}
      } else cb([]);
    }
  };
  xhr.onerror=function(){cb([]);};
  xhr.send();
}

function getBirthdays(){
  var today=new Date();today.setHours(0,0,0,0);
  var res=[];
  for(var i=0;i<allEvents.length;i++){
    var ev=allEvents[i];
    if(ev.summary.toLowerCase().indexOf('geburtstag')===-1)continue;
    var ed=new Date(ev.start);
    var ty=new Date(today.getFullYear(),ed.getMonth(),ed.getDate());
    var diff=Math.round((ty-today)/86400000);
    if(diff>=0&&diff<=7)res.push({summary:ev.summary,date:ty,days:diff});
  }
  return res;
}

function buildSailCard(loc,data){
  var today=new Date();
  var dSat=(6-today.getDay()+7)%7||7;
  var HOURS=[6,9,12,15,18];
  var HLABELS=['06','09','12','15','18'];
  function dayTable(dayOffset,label){
    var targetDate=new Date(today);
    targetDate.setDate(today.getDate()+dayOffset);
    var dateStr=targetDate.getFullYear()+'-'+p2(targetDate.getMonth()+1)+'-'+p2(targetDate.getDate());
    var times=data.hourly.time||[];
    var indices=[];
    for(var hi=0;hi<HOURS.length;hi++){
      var target=dateStr+'T'+p2(HOURS[hi])+':00';
      var idx=-1;
      for(var ti=0;ti<times.length;ti++){if(times[ti]===target){idx=ti;break;}}
      indices.push(idx);
    }
    var temps=[], rains=[], winds=[], gusts=[], wdirs=[], wcodes=[];
    for(var ii=0;ii<indices.length;ii++){
      var idx=indices[ii];
      temps.push(idx>=0?Math.round(data.hourly.temperature_2m[idx]):null);
      rains.push(idx>=0?Math.round((data.hourly.precipitation[idx]||0)*10)/10:null);
      winds.push(idx>=0?kn2bft(data.hourly.windspeed_10m[idx]):null);
      gusts.push(idx>=0?kn2bft(data.hourly.windgusts_10m[idx]||0):null);
      wdirs.push(idx>=0?data.hourly.winddirection_10m[idx]:null);
      wcodes.push(idx>=0?data.hourly.weathercode[idx]:null);
    }
    var hdrCells='<th class="st-lbl-hdr"></th>';
    for(var hi=0;hi<HLABELS.length;hi++) hdrCells+='<th class="st-hdr">'+HLABELS[hi]+'</th>';
    var iconRow='<tr><td class="st-lbl"></td>',tempRow='<tr><td class="st-lbl">°C</td>',rainRow='<tr><td class="st-lbl">mm</td>',windRow='<tr><td class="st-lbl">Bft</td>',gustRow='<tr><td class="st-lbl">Böen</td>',dirRow='<tr><td class="st-lbl">↑</td>';
    for(var ci=0;ci<HOURS.length;ci++){
      iconRow+='<td class="st-cell" style="font-size:.9rem">'+(wcodes[ci]!==null?wmoIcon(wcodes[ci]):'')+'</td>';
      tempRow+='<td class="st-cell">'+(temps[ci]!==null?temps[ci]+'°':'')+'</td>';
      var rc=rains[ci]>2?'#e07070':rains[ci]>0.5?'#f0b060':'#7ec8a0';
      rainRow+='<td class="st-cell" style="color:'+rc+'">'+(rains[ci]!==null?rains[ci]:'')+'</td>';
      var wc=winds[ci]!==null?bftColor(winds[ci]):'transparent';
      var wtxt=winds[ci]!==null&&winds[ci]>=6?'#fff':'#000';
      windRow+='<td class="st-cell st-bft" style="background:'+wc+';color:'+wtxt+'">'+(winds[ci]!==null?winds[ci]:'')+'</td>';
      var gc=gusts[ci]!==null?bftColor(gusts[ci]):'transparent';
      var gtxt=gusts[ci]!==null&&gusts[ci]>=6?'#fff':'#000';
      gustRow+='<td class="st-cell st-bft" style="background:'+gc+';color:'+gtxt+'">'+(gusts[ci]!==null?gusts[ci]:'')+'</td>';
      dirRow+='<td class="st-cell">'+(wdirs[ci]!==null?wdirArrow(wdirs[ci],bftColor(winds[ci]||0)):'')+'</td>';
    }
    iconRow+='</tr>'; tempRow+='</tr>'; rainRow+='</tr>'; windRow+='</tr>'; gustRow+='</tr>'; dirRow+='</tr>';
    return '<div class="sc-day-tbl"><div class="sc-day-title">'+label+'</div><table class="sail-tbl"><thead><tr>'+hdrCells+'</tr></thead><tbody>'+iconRow+tempRow+rainRow+windRow+gustRow+dirRow+'</tbody></table></div>';
  }
  return '<div class="sc"><div class="sc-title">⛵ Segelwetter '+loc.name+' — Wochenende</div><div class="sc-two-days">'+dayTable(dSat,'Samstag')+dayTable(dSat+1,'Sonntag')+'</div></div>';
}

    return '<div class="wkc-day"><div class="wkc-day-name">'+name+'</div>'+evHtml+'</div>';
  }
  return '<div class="wkc"><div class="wkc-title">📅 Wochenende</div><div class="wkc-grid">'+dc(sat)+dc(sun)+'</div></div>';
}

// ── FEED SCROLL ──────────────────────────────────────────────────
function startFeedScroll(){
  if(feedRAF){cancelAnimationFrame(feedRAF);feedRAF=null;}
  feedLastTs=null;
  var track=gel('feed-track');
  var half=track.scrollHeight/2;
  function step(ts){
    if(!feedLastTs)feedLastTs=ts;
    var dt=(ts-feedLastTs)/1000;feedLastTs=ts;
    feedY+=40*dt;
    if(feedY>=half)feedY=0;
    track.style.webkitTransform='translateY(-'+feedY+'px)';
    track.style.transform='translateY(-'+feedY+'px)';
    feedRAF=requestAnimationFrame(step);
  }
  feedRAF=requestAnimationFrame(step);
}

// ── BUILD FEED ───────────────────────────────────────────────────
function buildFeed(){
  if(feedRAF){cancelAnimationFrame(feedRAF);feedRAF=null;feedLastTs=null;}
  feedY=0;
  var track=gel('feed-track');
  track.style.webkitTransform=''; track.style.transform='';
  track.innerHTML='<div style="padding:20px;text-align:center;color:var(--ink3);font-size:.8rem">Nachrichten werden geladen…</div>';

  var newsResults=[];
  var rssRemaining=FAZ.length;
  var homeWeather=null,homeWeatherLoc=null;
  var sailWeather=null,sailWeatherLoc=null;
  var weatherRemaining=2;

  function tryAssemble(){
    if(rssRemaining>0||weatherRemaining>0)return;
    var byRes=[];
    for(var i=0;i<newsResults.length;i++){if(newsResults[i]&&newsResults[i].length)byRes.push({label:FAZ[i].label,articles:newsResults[i]});}
    var html='',ri=0;
    function addRes(){if(ri<byRes.length){var r=byRes[ri++];html+=sh('FAZ — '+r.label)+buildNewsCards(r.articles);}}
    html+=sh('🎂 Geburtstage')+buildBdayCards();
    addRes();
    if(homeWeather)html+=sh('☀️ Wetter')+buildWeatherCard(homeWeatherLoc,homeWeather);
    addRes();
    if(sailWeather)html+=sh('⛵ Segelwetter')+buildSailCard(sailWeatherLoc,sailWeather);
    addRes();
    html+=sh('🏖️ Schulferien')+buildHolidayCard();
    addRes();
    html+=sh('📅 Wochenende')+buildWeekendCard();
    var extras=[
      function(){html+=sh('🏖️ Schulferien')+buildHolidayCard();},
      function(){if(homeWeather)html+=sh('☀️ Wetter')+buildWeatherCard(homeWeatherLoc,homeWeather);},
      function(){html+=sh('📅 Wochenende')+buildWeekendCard();}
    ];
    var ei=0;
    while(ri<byRes.length){addRes();if(ei<extras.length)extras[ei++]();}
    track.innerHTML=html+html;
    setTimeout(function(){startFeedScroll();},200);
  }

  for(var i=0;i<FAZ.length;i++){
    (function(idx,feed){
      fetchRSS(feed,function(arts){
        newsResults[idx]=arts;
        rssRemaining--;
        tryAssemble();
      });
    })(i,FAZ[i]);
  }

  getWeather(cfg.city,function(loc,data){
    homeWeatherLoc=loc; homeWeather=data;
    weatherRemaining--;
    tryAssemble();
  });
  getWeather(cfg.sail,function(loc,data){
    sailWeatherLoc=loc; sailWeather=data;
    weatherRemaining--;
    tryAssemble();
  });
}

// ── SETTINGS ─────────────────────────────────────────────────────
function openSettings(){
  if(feedRAF){cancelAnimationFrame(feedRAF);feedRAF=null;feedLastTs=null;}
  gel('feed-outer').style.display='none';
  gel('cal-overlay').className='';
  gel('u-f1').value=cfg.uF1; gel('u-f2').value=cfg.uF2;
  gel('c-f1').value=cfg.cF1; gel('c-f2').value=cfg.cF2;
  gel('n-k1').value=cfg.nK1; gel('n-k2').value=cfg.nK2; gel('n-k3').value=cfg.nK3;
  gel('u-k1').value=cfg.uK1; gel('u-k2').value=cfg.uK2; gel('u-k3').value=cfg.uK3;
  gel('c-k1').value=cfg.cK1; gel('c-k2').value=cfg.cK2; gel('c-k3').value=cfg.cK3;
  gel('s-city').value=cfg.city; gel('s-sail').value=cfg.sail;
  gel('s-st1').value=cfg.st1; gel('s-st2').value=cfg.st2;
  gel('t-ms').value=cfg.tMs; gel('t-me').value=cfg.tMe;
  gel('t-as').value=cfg.tAs; gel('t-ae').value=cfg.tAe;
  gel('settings-overlay').className='open';
}
function closeSettings(){
  gel('settings-overlay').className='';
  gel('feed-outer').style.display='block';
  saveCfg();
  refreshCalendars();
  buildFeed();
  checkAutoMode();
}

// ── TOUCH EVENTS ─────────────────────────────────────────────────
function addTap(id,fn){
  var el=gel(id); if(!el)return;
  el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();fn();},{passive:false});
  el.addEventListener('click',function(e){e.preventDefault();fn();});
}

gel('feed-outer').addEventListener('touchend',function(e){e.preventDefault();onScreenTap();},{passive:false});
gel('feed-outer').addEventListener('click',function(){onScreenTap();});
gel('cal-overlay').addEventListener('touchend',function(e){
  var t=e.target;
  if(t.id==='scrl-up'||t.id==='scrl-dn'||t.id==='scrl-nx'||t.id==='wk-btn-el'||t.id==='gear-btn')return;
  if(!isCalTime()){hideCalendar();if(tapTimer){clearTimeout(tapTimer);tapTimer=null;}}
},{passive:false});

addTap('scrl-up',function(){gel('cal-scroll').scrollTop-=200;});
addTap('scrl-dn',function(){gel('cal-scroll').scrollTop+=200;});
addTap('scrl-nx',function(){calOffDays++;showCalendar();});
addTap('wk-btn-el',openWeek);
addTap('wk-close-btn',closeWeek);
addTap('gear-btn',openSettings);
addTap('s-close-btn',closeSettings);
addTap('s-save-btn',closeSettings);

// ── INIT ─────────────────────────────────────────────────────────
loadCfg(); applyCss();
buildTimeAxis(); updateClock(); updateRedLine();
keepAwake();

setInterval(updateClock,15000);
setInterval(updateRedLine,60000);
setInterval(checkAutoMode,60000);
setInterval(refreshCalendars,5*60*1000);
setInterval(buildFeed,10*60*1000);

refreshCalendars();
buildFeed();
checkAutoMode();

var hasConfig=cfg.uF1||cfg.uF2||cfg.uK1||cfg.uK2||cfg.uK3;
if(!hasConfig)setTimeout(openSettings,1500);
</script>
